document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t-placeholder-val=\"{{ true }}\">\n<div style=\"padding:56px 26px 34px;display:flex;flex-direction:column;gap:18px;max-width:560px;margin:0 auto\">\n<div style=\"font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)\"><span data-l=\"en\">Thailand · community-run<\u002Fspan><span data-l=\"th\">ประเทศไทย · ข้อมูลจากชุมชน<\u002Fspan><\u002Fdiv>\n<h1 style=\"font:500 40px/1.05 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em\"><span data-l=\"en\">Find a film lab.<\u002Fspan><span data-l=\"th\">หาร้านล้างฟิล์ม<\u002Fspan><\u002Fh1>\n<p style=\"margin:0;font:400 15px/1.65 var(--sans);color:var(--ash);max-width:46ch\"><span data-l=\"en\">Labs near you, or anywhere in Thailand. No account needed to browse — one is only asked for when you contribute.<\u002Fspan><span data-l=\"th\" data-blk=\"\">ร้านใกล้คุณ หรือที่ไหนก็ได้ในไทย เปิดดูได้เลยไม่ต้องมีบัญชี — ขอเมื่อคุณจะเพิ่มข้อมูลเท่านั้น<\u002Fspan><\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:10px;margin-top:8px\">\n<button sc-camel-on-click=\"{{ useLocation }}\" style=\"border:2px solid var(--ink);border-radius:4px;padding:14px 16px;font:700 14px var(--sans);display:flex;align-items:center;gap:10px\">⌖ <span data-l=\"en\">Use my location<\u002Fspan><span data-l=\"th\">ใช้ตำแหน่งของฉัน<\u002Fspan><\u002Fbutton>\n<button sc-camel-on-click=\"{{ goArea }}\" style=\"border:2px solid var(--ink);border-radius:4px;padding:14px 16px;font:700 14px var(--sans);display:flex;align-items:center;gap:10px\">⌕ <span data-l=\"en\">Search an area or city<\u002Fspan><span data-l=\"th\">ค้นหาย่านหรือจังหวัด<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin:6px 0 0;padding-top:14px;border-top:1px solid var(--hair);font:400 12px/1.6 var(--sans);color:var(--faint)\"><span data-l=\"en\">Both are equal weight — the location prompt only ever fires from a tap.<\u002Fspan><span data-l=\"th\" data-blk=\"\">ทั้งสองทางเท่ากัน — ระบบจะขออนุญาตตำแหน่งเมื่อคุณกดเท่านั้น<\u002Fspan><\u002Fp>\n<button sc-camel-on-click=\"{{ denyLocation }}\" style=\"font:400 11px var(--sans);color:var(--faint);text-decoration:underline\">simulate: location denied<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sLocating }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column\">\n<div style=\"padding:12px 16px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px\">\n<div style=\"width:15px;height:15px;border:1.5px dashed var(--ink);border-radius:50%\"><\u002Fdiv>\n<div style=\"font:400 13px var(--sans);color:var(--ash)\"><span data-l=\"en\">Locating…<\u002Fspan><span data-l=\"th\">กำลังหาตำแหน่ง…<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<button sc-camel-on-click=\"{{ goArea }}\" style=\"font:400 11px var(--sans);text-decoration:underline\"><span data-l=\"en\">Cancel<\u002Fspan><span data-l=\"th\">ยกเลิก<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<sc-for list=\"{{ skeleton }}\" as=\"k\" hint-placeholder-count=\"4\">\n<div style=\"padding:16px;border-bottom:1px solid var(--hair);display:flex;gap:14px\">\n<div style=\"width:74px;height:74px;flex:none;background:var(--sunk);border-radius:4px\"><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n<div style=\"height:13px;width:62%;background:var(--sunk);border-radius:2px\"><\u002Fdiv>\n<div style=\"height:10px;width:38%;background:var(--sunk);border-radius:2px\"><\u002Fdiv>\n<div style=\"height:10px;width:76%;background:var(--sunk);border-radius:2px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sArea }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column\">\n<sc-if value=\"{{ denied }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:11px 16px;border-bottom:1.5px solid var(--ink);background:var(--sunk);font:400 12px/1.6 var(--sans)\"><span data-l=\"en\">Location is off. Search an area instead — or turn it on in Settings.<\u002Fspan><span data-l=\"th\" data-blk=\"\">ตำแหน่งปิดอยู่ ค้นหาย่านแทนได้ — หรือเปิดในการตั้งค่า<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"padding:16px;border-bottom:1px solid var(--hair)\">\n<input value=\"{{ areaQuery }}\" sc-camel-on-change=\"{{ onAreaQuery }}\" placeholder=\"area, district or city\" style=\"width:100%;border:2px solid var(--ink);border-radius:4px;padding:11px 12px;font:400 14px var(--sans)\">\n<\u002Fdiv>\n<div style=\"padding:14px 16px 6px;font:700 10px var(--sans);letter-spacing:.12em;color:var(--faint)\"><span data-l=\"en\">POPULAR AREAS<\u002Fspan><span data-l=\"th\">ย่านยอดนิยม<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ areaResults }}\" as=\"a\" hint-placeholder-count=\"5\">\n<button sc-camel-on-click=\"{{ a.pick }}\" style=\"width:100%;padding:12px 16px;border-bottom:1px solid var(--hair);display:flex;align-items:baseline;gap:10px\">\n<div style=\"flex:1;min-width:0\">\n<div data-l=\"en\" data-blk=\"\"><div style=\"font:500 15px Fraunces,serif\">{{ a.en }}<\u002Fdiv><div style=\"font:400 12px 'Noto Sans Thai',sans-serif;color:var(--ash)\">{{ a.th }}<\u002Fdiv><\u002Fdiv>\n<div data-l=\"th\" data-blk=\"\"><div style=\"font:600 15px 'Noto Sans Thai',sans-serif\">{{ a.th }}<\u002Fdiv><div style=\"font:400 12px Fraunces,serif;color:var(--ash)\">{{ a.en }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 11px var(--sans);color:var(--faint);white-space:nowrap\">{{ a.meta }}<\u002Fdiv>\n<\u002Fbutton>\n<\u002Fsc-for>\n<div style=\"padding:18px 16px;display:flex;justify-content:center\">\n<button sc-camel-on-click=\"{{ useLocation }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:9px 14px;font:700 12px var(--sans)\">⌖ <span data-l=\"en\">Try my location again<\u002Fspan><span data-l=\"th\">ลองใช้ตำแหน่งอีกครั้ง<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sDiscovery }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column\">\n<div style=\"padding:11px 16px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:9px\">\n<div style=\"width:14px;height:14px;border:1.5px solid var(--ink);border-radius:50%\"><\u002Fdiv>\n<div style=\"font:400 13px var(--sans)\"><span data-l=\"en\">{{ areaLabel }}<\u002Fspan><span data-l=\"th\" style=\"font-size:13px\">{{ areaLabelTh }}<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<button sc-camel-on-click=\"{{ goArea }}\" style=\"font:400 11px var(--sans);text-decoration:underline\"><span data-l=\"en\">Change<\u002Fspan><span data-l=\"th\">เปลี่ยน<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<div style=\"padding:12px 16px;border-bottom:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:7px\">\n<sc-for list=\"{{ filterProcs }}\" as=\"p\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ p.toggle }}\" data-process=\"{{ p.k }}\" data-on=\"{{ p.active }}\" style=\"border:1.5px solid;border-radius:4px;padding:6px 11px;font:700 12px var(--sans)\">{{ p.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<div style=\"width:1px;background:var(--hair);margin:0 4px\"><\u002Fdiv>\n<sc-for list=\"{{ filterScanners }}\" as=\"sc\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ sc.toggle }}\" data-on=\"{{ sc.active }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:6px 11px;font:700 12px var(--sans)\">{{ sc.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"padding:10px 16px;border-bottom:1px solid var(--hair);display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n<span style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">WITHIN<\u002Fspan><span data-l=\"th\">ระยะ<\u002Fspan><\u002Fspan>\n<div style=\"display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden\">\n<sc-for list=\"{{ radii }}\" as=\"r\" hint-placeholder-count=\"3\">\n<button sc-camel-on-click=\"{{ r.pick }}\" data-tabon=\"{{ r.active }}\" style=\"padding:5px 11px;font:700 11px var(--sans);border-right:1px solid var(--hair)\">{{ r.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ toggleOpen }}\" data-on=\"{{ openOnly }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:5px 11px;font:700 11px var(--sans)\"><span data-l=\"en\">Open now<\u002Fspan><span data-l=\"th\">เปิดอยู่<\u002Fspan><\u002Fbutton>\n<sc-if value=\"{{ hasFilters }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ clearFilters }}\" style=\"font:400 11px var(--sans);color:var(--signal);text-decoration:underline\"><span data-l=\"en\">Clear all<\u002Fspan><span data-l=\"th\">ล้างทั้งหมด<\u002Fspan><\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"padding:10px 16px;border-bottom:1.5px solid var(--ink);display:flex;align-items:center;gap:12px\">\n<div style=\"font:400 11px var(--sans);color:var(--ash)\"><span data-l=\"en\">{{ countLine }}<\u002Fspan><span data-l=\"th\">{{ countLineTh }}<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden\">\n<button sc-camel-on-click=\"{{ setList }}\" data-tabon=\"{{ isList }}\" style=\"padding:4px 11px;font:700 11px var(--sans)\"><span data-l=\"en\">List<\u002Fspan><span data-l=\"th\">รายการ<\u002Fspan><\u002Fbutton>\n<button sc-camel-on-click=\"{{ setMap }}\" data-tabon=\"{{ isMap }}\" style=\"padding:4px 11px;font:700 11px var(--sans);border-left:1.5px solid var(--ink)\"><span data-l=\"en\">Map<\u002Fspan><span data-l=\"th\">แผนที่<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:flex-start\">\n<sc-if value=\"{{ showList }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"flex:1;min-width:0\">\n<sc-for list=\"{{ visibleLabs }}\" as=\"lab\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ lab.open } ION<\u002Fspan><span data-l=\"th\">ผู้ร่วมเพิ่มข้อมูล<\u002Fspan><\u002Fdiv>\n<div style=\"font:400 12px/1.8 var(--sans);color:var(--ash)\"><span data-l=\"en\">Last edited <\u002Fspan><span data-l=\"th\">แก้ไขล่าสุด <\u002Fspan>{{ lastEditLine }}<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;margin-top:8px\">\n<button sc-camel-on-click=\"{{ goHistory }}\" style=\"text-align:left;font:400 12px var(--sans);text-decoration:underline\"><span data-l=\"en\">Edit history<\u002Fspan><span data-l=\"th\">ประวัติการแก้ไข<\u002Fspan> {{ historyCount }}<\u002Fbutton>\n<button sc-camel-on-click=\"{{ markClosed }}\" style=\"text-align:left;font:400 12px var(--sans);text-decoration:underline\"><span data-l=\"en\">{{ markClosedLabel }}<\u002Fspan><span data-l=\"th\">{{ markClosedLabelTh }}<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ hasInventory }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div style=\"font:700 10px var(--sans);letter-spacing:.12em;color:var(--faint);margin-bottom:9px\"><span data-l=\"en\">IN STORE · FILM STOCK<\u002Fspan><span data-l=\"th\">สินค้าในร้าน · ฟิล์ม<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px\">\n<sc-for list=\"{{ stockChipsForLab }}\" as=\"s\" hint-placeholder-count=\"3\">\n<button sc-camel-on-click=\"{{ s.open }}\" style=\"border:1.5px solid var(--ink);padding:4px 10px;font:400 12px var(--sans)\">{{ s.name }} ↗<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font:700 10px var(--sans);letter-spacing:.12em;color:var(--faint);margin-bottom:9px\"><span data-l=\"en\">DARKROOM SUPPLIES<\u002Fspan><span data-l=\"th\">อุปกรณ์ห้องมืด<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<sc-for list=\"{{ suppliesTags }}\" as=\"t\" hint-placeholder-count=\"2\">\n<span style=\"border:1px solid var(--faint);padding:4px 10px;font:400 12px var(--sans);color:var(--ash)\">{{ t.label }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"padding-top:6px;border-top:1px solid var(--hair)\">\n<button sc-camel-on-click=\"{{ openEdit }}\" style=\"border:1.5px solid var(--signal);background:var(--signal);color:#FDFDFC;padding:11px 18px;font:700 14px var(--sans)\"><span data-l=\"en\">Suggest an edit<\u002Fspan><span data-l=\"th\">เสนอแก้ไขข้อมูล<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"flex:1 1 300px;min-width:0;padding:22px 20px 30px;border-left:1px solid var(--hair);display:flex;flex-direction:column;gap:20px\">\n\n<div>\n<div style=\"font:700 10px var(--sans);letter-spacing:.12em;color:var(--faint);margin-bottom:9px\"><span data-l=\"en\">LOCATION<\u002Fspan><span data-l=\"th\">แผนที่<\u002Fspan><\u002Fdiv>\n<div style=\"position:relative;height:150px;background:repeating-linear-gradient(0deg,var(--sunk) 0 22px,var(--paper) 22px 23px),repeating-linear-gradient(90deg,var(--sunk) 0 22px,var(--paper) 22px 23px);border:1px solid var(--hair)\">\n<div style=\"position:absolute;left:50%;top:50%;width:20px;height:20px;border:1.5px solid var(--ink);transform:rotate(-45deg) translate(10px,10px);background:var(--ink)\"><\u002Fdiv>\n<\u002Fdiv>\n<div data-filled=\"{{ addrFilled }}\" style=\"font:400 12px/1.7 var(--sans);color:var(--ink);margin-top:9px\"><span data-l=\"en\">{{ addrLine }}<\u002Fspan><span data-l=\"th\">{{ addrLine }}<\u002Fspan><\u002Fdiv>\n<div data-filled=\"{{ landmarkFilled }}\" style=\"font:400 12px/1.7 var(--sans);color:var(--ash);margin-top:4px\"><span data-l=\"en\">◆ {{ landmarkLine }}<\u002Fspan><span data-l=\"th\">◆ {{ landmarkLine }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.12em;color:var(--faint)\"><span data-l=\"en\">HOURS<\u002Fspan><span data-l=\"th\">เวลาเปิด<\u002Fspan><\u002Fdiv>\n<button sc-camel-on-click=\"{{ toggleHours }}\" style=\"font:400 10px var(--sans);text-decoration:underline\"><span data-l=\"en\">{{ hoursToggleLabel }}<\u002Fspan><span data-l=\"th\">{{ hoursToggleLabelTh }}<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ hoursExpanded }}\" hint-placeholder-val=\"{{ true }}\">\n<sc-for list=\"{{ hoursRows }}\" as=\"h\" hint-placeholder-count=\"7\">\n<div style=\"display:flex;justify-content:space-between;font:400 12px var(--sans);padding:4px 0;border-bottom:1px solid var(--hair)\"><span data-l=\"en\">{{ h.d }}<\u002Fspan><span data-l=\"th\">{{ h.dTh }}<\u002Fspan><span><span data-l=\"en\">{{ h.time }}<\u002Fspan><span data-l=\"th\">{{ h.timeTh }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"border:1px dashed var(--faint);padding:7px 9px;font:400 10px/1.5 var(--sans);color:var(--ash);margin-top:8px\"><span data-l=\"en\">Open/closed is computed from this schedule. A manual override wins over it when set.<\u002Fspan><span data-l=\"th\" data-blk=\"\">สถานะเปิด/ปิดคำนวณจากตารางนี้ การตั้งค่าด้วยตนเองจะมีผลเหนือกว่าเมื่อกำหนดไว้<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div>\n<div style=\"font:700 10px var(--sans);letter-spacing:.12em;color:var(--faint);margin-bottom:9px\"><span data-l=\"en\">CONTACT<\u002Fspan><span data-l=\"th\">ติดต่อ<\u002Fspan><\u002Fdiv>\n<div style=\"font:400 12px/1.9 var(--sans);color:var(--ink)\">\n<sc-for list=\"{{ contactRows }}\" as=\"c\" hint-placeholder-count=\"2\">\n<div>{{ c.prefix }} {{ c.v }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ hasContacts }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-filled=\"false\" style=\"font:400 12px var(--sans);margin-top:2px\"><span data-l=\"en\">Not yet added — + Add<\u002Fspan><span data-l=\"th\">ยังไม่มีข้อมูล — + เพิ่ม<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sEdit }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:24px 20px 34px;display:flex;flex-direction:column;gap:22px;max-width:720px\">\n<div>\n<div style=\"font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)\">\n<sc-if value=\"{{ isCreateMode }}\" hint-placeholder-val=\"{{ false }}\"><span data-l=\"en\">Add a lab<\u002Fspan><span data-l=\"th\">เพิ่มร้านใหม่<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ isEditMode }}\" hint-placeholder-val=\"{{ true }}\"><span data-l=\"en\">Suggest an edit<\u002Fspan><span data-l=\"th\">เสนอแก้ไขข้อมูล<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<h1 style=\"margin:6px 0 0;font:500 26px/1.15 Fraunces,serif\">{{ draftLabName }}<\u002Fh1>\n<p style=\"margin:8px 0 0;font:400 12.5px/1.7 var(--sans);color:var(--ash)\"><span data-l=\"en\">Every field goes live the moment you save it — no review queue. The change is attributed to you and reversible by anyone.<\u002Fspan><span data-l=\"th\" data-blk=\"\">ทุกช่องจะขึ้นทันทีที่บันทึก — ไม่มีคิวตรวจ การแก้ไขจะระบุชื่อคุณ และย้อนกลับได้โดยใครก็ได้<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isCreateMode }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n<label style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">LAB NAME · TH<\u002Fspan><span data-l=\"th\">ชื่อร้าน · ไทย<\u002Fspan><\u002Fspan>\n<input value=\"{{ draftNameTh }}\" sc-camel-on-change=\"{{ onNameTh }}\" placeholder=\"ชื่อร้าน\" style=\"border:2px solid var(--ink);border-radius:4px;padding:10px 12px;font:400 14px var(--sans)\">\n<\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">LAB NAME · EN<\u002Fspan><span data-l=\"th\">ชื่อร้าน · อังกฤษ<\u002Fspan><\u002Fspan>\n<input value=\"{{ draftNameEn }}\" sc-camel-on-change=\"{{ onNameEn }}\" placeholder=\"Latin name\" style=\"border:2px solid var(--ink);border-radius:4px;padding:10px 12px;font:400 14px var(--sans)\">\n<\u002Flabel>\n<\u002Fdiv>\n<div style=\"font:400 11px/1.6 var(--sans);color:var(--faint)\"><span data-l=\"en\">At least one name is required.<\u002Fspan><span data-l=\"th\" data-blk=\"\">ต้องมีชื่ออย่างน้อยหนึ่งภาษา<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">LOCATION · TAP TO DROP A PIN<\u002Fspan><span data-l=\"th\">ตำแหน่งที่ตั้ง · แตะเพื่อปักหมุด<\u002Fspan><\u002Fdiv>\n<button sc-camel-on-click=\"{{ placePin }}\" style=\"position:relative;height:170px;width:100%;background:repeating-linear-gradient(0deg,var(--sunk) 0 22px,var(--paper) 22px 23px),repeating-linear-gradient(90deg,var(--sunk) 0 22px,var(--paper) 22px 23px);border:2px solid var(--ink);border-radius:4px\">\n<sc-for list=\"{{ draftOtherPins }}\" as=\"op\" hint-placeholder-count=\"3\">\n<div style=\"position:absolute;left:{{ op.left }};top:{{ op.top }};width:14px;height:14px;border:1.5px dashed var(--faint);border-radius:50% 50% 50% 0;transform:translate(-7px,-7px) rotate(-45deg)\"><\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ draftPinPlaced }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"position:absolute;left:{{ draftPin.left }};top:{{ draftPin.top }};width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50% 50% 50% 0;transform:translate(-10px,-10px) rotate(-45deg);background:var(--signal)\"><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ draftPinPlaced }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;display:grid;place-items:center;font:400 11px var(--sans);color:var(--faint)\"><span data-l=\"en\">Tap the map to drop a pin<\u002Fspan><span data-l=\"th\">แตะแผนที่เพื่อปักหมุด<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fbutton>\n<sc-if value=\"{{ hasDraftNearby }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1px dashed var(--faint);padding:8px 10px;font:400 11px/1.6 var(--sans);color:var(--ash)\"><span data-l=\"en\">⚠ Already listed near this pin: {{ draftNearby }}. Same place? Edit the existing listing instead.<\u002Fspan><span data-l=\"th\" data-blk=\"\">⚠ มีร้านอยู่ใกล้จุดนี้แล้ว: {{ draftNearby }} — ถ้าเป็นร้านเดียวกัน แก้ไขรายการเดิมแทน<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<label style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">STREET / AREA · auto-filled from the pin, edit if needed<\u002Fspan><span data-l=\"th\">ถนน / ย่าน · เติมอัตโนมัติจากหมุด แก้ไขได้<\u002Fspan><\u002Fspan>\n<input value=\"{{ draftAddr }}\" sc-camel-on-change=\"{{ onAddr }}\" placeholder=\"street, district\" style=\"border:1.5px solid var(--hair);border-radius:4px;padding:8px 10px;font:400 13px var(--sans)\">\n<\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">LANDMARK · WHAT TO LOOK FOR<\u002Fspan><span data-l=\"th\">จุดสังเกต<\u002Fspan><\u002Fspan>\n<input value=\"{{ draftLandmark }}\" sc-camel-on-change=\"{{ onLandmark }}\" placeholder=\"e.g. above the 7-Eleven, unmarked door\" style=\"border:2px solid var(--ink);border-radius:4px;padding:10px 12px;font:400 14px var(--sans)\">\n<\u002Flabel>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">PROCESSES OFFERED<\u002Fspan><span data-l=\"th\">กระบวนการที่รับ<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n<sc-for list=\"{{ draftProcs }}\" as=\"p\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ p.toggle }}\" data-process=\"{{ p.k }}\" data-on=\"{{ p.active }}\" style=\"border:1.5px solid;border-radius:4px;padding:8px 13px;font:700 12.5px var(--sans)\">{{ p.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">SCANNERS<\u002Fspan><span data-l=\"th\">สแกนเนอร์<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n<sc-for list=\"{{ draftScanners }}\" as=\"sc\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ sc.toggle }}\" data-on=\"{{ sc.active }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:8px 13px;font:700 12.5px var(--sans)\">{{ sc.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">PRICING & TURNAROUND · PER PROCESS<\u002Fspan><span data-l=\"th\">ราคาและระยะเวลา · ตามกระบวนการ<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{ hasDraftProcs }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border:2px solid var(--ink);border-radius:8px;overflow:hidden\">\n<div style=\"display:flex;font:700 9px var(--sans);letter-spacing:.06em;color:var(--faint);padding:8px 12px;border-bottom:1.5px solid var(--ink);background:var(--sunk)\">\n<div style=\"flex:1.3\"><span data-l=\"en\">PROCESS<\u002Fspan><span data-l=\"th\">กระบวนการ<\u002Fspan><\u002Fdiv><div style=\"width:96px;text-align:center\">135<\u002Fdiv><div style=\"width:96px;text-align:center\">120<\u002Fdiv><div style=\"flex:1.1;text-align:right\"><span data-l=\"en\">TURNAROUND<\u002Fspan><span data-l=\"th\">ระยะเวลา<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ draftPricingRows }}\" as=\"row\" hint-placeholder-count=\"2\">\n<div style=\"display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px dotted var(--hair)\">\n<div style=\"flex:1.3;font:700 12px var(--sans)\">{{ row.label }}<\u002Fdiv>\n<input value=\"{{ row.p135 }}\" sc-camel-on-change=\"{{ row.onP135 }}\" placeholder=\"e.g. ฿180 / roll\" style=\"width:96px;border:1.5px solid var(--hair);border-radius:4px;padding:6px 8px;font:400 12px var(--sans);text-align:center\">\n<input value=\"{{ row.p120 }}\" sc-camel-on-change=\"{{ row.onP120 }}\" placeholder=\"e.g. ฿180 / roll\" style=\"width:96px;border:1.5px solid var(--hair);border-radius:4px;padding:6px 8px;font:400 12px var(--sans);text-align:center\">\n<input value=\"{{ row.turn }}\" sc-camel-on-change=\"{{ row.onTurn }}\" placeholder=\"e.g. within a day\" style=\"flex:1.1;border:1.5px solid var(--hair);border-radius:4px;padding:6px 8px;font:400 12px var(--sans);text-align:right\">\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ hasDraftProcs }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font:400 11px/1.6 var(--sans);color:var(--faint)\"><span data-l=\"en\">Pick a process above to set its pricing.<\u002Fspan><span data-l=\"th\">เลือกกระบวนการด้านบนก่อนตั้งราคา<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">SERVICES<\u002Fspan><span data-l=\"th\">บริการ<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ draftServiceRows }}\" as=\"sv\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n<button sc-camel-on-click=\"{{ sv.toggle }}\" data-svstate=\"{{ sv.on }}\" style=\"display:flex;align-items:center;gap:9px;font:400 12.5px var(--sans)\">\n<span class=\"svbox\">{{ sv.mark }}<\u002Fspan>\n<span><span data-l=\"en\">{{ sv.label }}<\u002Fspan><span data-l=\"th\">{{ sv.labelTh }}<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ sv.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-if value=\"{{ sv.on }}\" hint-placeholder-val=\"{{ false }}\">\n<input value=\"{{ sv.note }}\" sc-camel-on-change=\"{{ sv.onNote }}\" placeholder=\"e.g. from ฿60\" style=\"width:140px;border:1.5px solid var(--hair);border-radius:4px;padding:5px 8px;font:400 11.5px var(--sans)\">\n<\u002Fsc-if>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-for list=\"{{ draftCustomServices }}\" as=\"cs\" hint-placeholder-count=\"1\">\n<div style=\"display:flex;align-items:center;gap:9px;font:400 12.5px var(--sans);color:var(--ash)\">\n<span class=\"svbox\">✓<\u002Fspan><span>{{ cs.label }}<\u002Fspan>\n<button sc-camel-on-click=\"{{ cs.remove }}\" style=\"font:700 11px var(--sans);color:var(--faint)\">✕<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"display:flex;gap:8px;align-items:center\">\n<input value=\"{{ draftCustomServiceText }}\" sc-camel-on-change=\"{{ onCustomServiceText }}\" placeholder=\"add a service not listed\" style=\"flex:1;border:1.5px solid var(--hair);border-radius:4px;padding:8px 10px;font:400 13px var(--sans)\">\n<button sc-camel-on-click=\"{{ addCustomService }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:8px 12px;font:700 12px var(--sans)\">+ <span data-l=\"en\">Add<\u002Fspan><span data-l=\"th\">เพิ่ม<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font:400 11px/1.6 var(--sans);color:var(--faint)\"><span data-l=\"en\">Community-added services show on the listing but aren't a search filter.<\u002Fspan><span data-l=\"th\" data-blk=\"\">บริการที่ชุมชนเพิ่มจะแสดงในหน้าร้าน แต่ไม่ใช่ตัวกรองค้นหา<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">IN STORE · FILM STOCK<\u002Fspan><span data-l=\"th\">สินค้าในร้าน · ฟิล์ม<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n<sc-for list=\"{{ draftStockChips }}\" as=\"st\" hint-placeholder-count=\"8\">\n<button sc-camel-on-click=\"{{ st.toggle }}\" data-on=\"{{ st.active }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:6px 11px;font:400 12px var(--sans)\">{{ st.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;align-items:center\">\n<input value=\"{{ draftNewStockName }}\" sc-camel-on-change=\"{{ onNewStockName }}\" placeholder=\"not in the list? name a new film stock\" style=\"flex:1;border:1.5px solid var(--hair);border-radius:4px;padding:8px 10px;font:400 13px var(--sans)\">\n<button sc-camel-on-click=\"{{ addNewStock }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:8px 12px;font:700 12px var(--sans)\">+ <span data-l=\"en\">Add to catalog<\u002Fspan><span data-l=\"th\">เพิ่มเข้าแคตตาล็อก<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ draftStockDuplicateMatch }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1px dashed var(--faint);border-radius:4px;padding:9px 11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n<span style=\"font:400 11.5px/1.6 var(--sans);color:var(--ash)\"><span data-l=\"en\">Already in the catalog as<\u002Fspan><span data-l=\"th\">มีอยู่แล้วในแคตตาล็อกในชื่อ<\u002Fspan> <b>{{ draftStockDuplicateMatch.name }}<\u002Fb><span data-l=\"en\">? Add that one instead, or keep typing to add a new entry anyway.<\u002Fspan><span data-l=\"th\" data-blk=\"\">ใช้อันนี้แทนได้ไหม หรือพิมพ์ต่อเพื่อเพิ่มรายการใหม่<\u002Fspan><\u002Fspan>\n<button sc-camel-on-click=\"{{ draftStockDuplicateMatch.use }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:5px 10px;font:700 11px var(--sans);white-space:nowrap\"><span data-l=\"en\">Use this one<\u002Fspan><span data-l=\"th\">ใช้อันนี้<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font:400 11px/1.6 var(--sans);color:var(--faint)\"><span data-l=\"en\">Must match a Film Stock catalog entry — reverse search from a stock's page depends on it.<\u002Fspan><span data-l=\"th\" data-blk=\"\">ต้องตรงกับรายการในแคตตาล็อกฟิล์ม — การค้นหาย้อนกลับจากหน้าฟิล์มขึ้นกับข้อมูลนี้<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">DARKROOM SUPPLIES<\u002Fspan><span data-l=\"th\">อุปกรณ์ห้องมืด<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n<sc-for list=\"{{ draftSupplyTags }}\" as=\"t\" hint-placeholder-count=\"8\">\n<button sc-camel-on-click=\"{{ t.toggle }}\" data-on=\"{{ t.active }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:6px 11px;font:400 12px var(--sans)\">{{ t.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<sc-for list=\"{{ draftCustomSupplies }}\" as=\"cs\" hint-placeholder-count=\"1\">\n<button sc-camel-on-click=\"{{ cs.remove }}\" data-on=\"true\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:6px 11px;font:400 12px var(--sans)\">{{ cs.label }} ✕<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;align-items:center\">\n<input value=\"{{ draftCustomSupplyText }}\" sc-camel-on-change=\"{{ onCustomSupplyText }}\" placeholder=\"add a supply not listed\" style=\"flex:1;border:1.5px solid var(--hair);border-radius:4px;padding:8px 10px;font:400 13px var(--sans)\">\n<button sc-camel-on-click=\"{{ addCustomSupply }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:8px 12px;font:700 12px var(--sans)\">+ <span data-l=\"en\">Add<\u002Fspan><span data-l=\"th\">เพิ่ม<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">CONTACT<\u002Fspan><span data-l=\"th\">ติดต่อ<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ draftContactRows }}\" as=\"c\" hint-placeholder-count=\"2\">\n<div style=\"display:flex;gap:8px;align-items:center\">\n<span style=\"width:76px;flex:none;font:700 11px var(--sans);color:var(--ash)\">{{ c.prefix }}<\u002Fspan>\n<input value=\"{{ c.v }}\" sc-camel-on-change=\"{{ c.onChange }}\" placeholder=\"value\" style=\"flex:1;border:1.5px solid var(--hair);border-radius:4px;padding:8px 10px;font:400 13px var(--sans)\">\n<button sc-camel-on-click=\"{{ c.remove }}\" style=\"font:700 11px var(--sans);color:var(--faint)\">✕<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n<sc-for list=\"{{ draftContactAdders }}\" as=\"a\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ a.add }}\" style=\"border:1px dashed var(--ink);border-radius:4px;padding:6px 11px;font:700 11.5px var(--sans);color:var(--ash)\">+ {{ a.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">OPENING HOURS<\u002Fspan><span data-l=\"th\">เวลาเปิด–ปิด<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid var(--ink);border-radius:8px;overflow:hidden\">\n<sc-for list=\"{{ draftHours }}\" as=\"h\" hint-placeholder-count=\"7\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px dotted var(--hair)\">\n<span style=\"width:46px;font:700 12px var(--sans)\"><span data-l=\"en\">{{ h.d }}<\u002Fspan><span data-l=\"th\">{{ h.dTh }}<\u002Fspan><\u002Fspan>\n<button sc-camel-on-click=\"{{ h.toggle }}\" data-on=\"{{ h.open }}\" style=\"border:1.5px solid var(--ink);border-radius:4px;padding:4px 10px;font:700 10.5px var(--sans);min-width:74px;text-align:center\"><span data-l=\"en\">{{ h.stateLabel }}<\u002Fspan><span data-l=\"th\">{{ h.stateLabelTh }}<\u002Fspan><\u002Fbutton>\n<input value=\"{{ h.from }}\" sc-camel-on-change=\"{{ h.onFrom }}\" placeholder=\"--:--\" style=\"width:70px;border:1.5px solid var(--hair);border-radius:4px;padding:5px 8px;font:400 12px var(--sans);text-align:center\">\n<span style=\"color:var(--faint)\">–<\u002Fspan>\n<input value=\"{{ h.to }}\" sc-camel-on-change=\"{{ h.onTo }}\" placeholder=\"--:--\" style=\"width:70px;border:1.5px solid var(--hair);border-radius:4px;padding:5px 8px;font:400 12px var(--sans);text-align:center\">\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font:400 11px/1.6 var(--sans);color:var(--faint)\"><span data-l=\"en\">Seven rows, not a freeform box — the shape of the data is the shape of the input.<\u002Fspan><span data-l=\"th\" data-blk=\"\">เจ็ดแถว ไม่ใช่ช่องพิมพ์อิสระ — รูปร่างของข้อมูลคือรูปร่างของช่องกรอก<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">ATMOSPHERE PHOTOS<\u002Fspan><span data-l=\"th\">ภาพบรรยากาศร้าน<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n<sc-for list=\"{{ draftPhotoTiles }}\" as=\"ph\" hint-placeholder-count=\"4\">\n<div style=\"position:relative;width:84px;height:84px\">\n<div data-stripe=\"\" style=\"width:100%;height:100%;border:1.5px solid var(--ink);border-radius:4px\"><\u002Fdiv>\n<button sc-camel-on-click=\"{{ ph.remove }}\" style=\"position:absolute;top:-7px;right:-7px;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);font:700 10px var(--sans);display:grid;place-items:center\">✕<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<button sc-camel-on-click=\"{{ addDraftPhoto }}\" style=\"width:84px;height:84px;border:1.5px dashed var(--ink);border-radius:4px;display:grid;place-items:center;font:700 18px var(--sans);color:var(--ash)\">+<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font:400 11px/1.6 var(--sans);color:var(--faint)\"><span data-l=\"en\">Venue documentation only — sample scans are never attached to a lab.<\u002Fspan><span data-l=\"th\" data-blk=\"\">เป็นภาพบันทึกสถานที่เท่านั้น ภาพตัวอย่างสแกนจะไม่ผูกกับร้าน<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<label style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:700 10px var(--sans);letter-spacing:.1em;color:var(--faint)\"><span data-l=\"en\">NOTE FOR THE HISTORY LOG · OPTIONAL<\u002Fspan><span data-l=\"th\">บันทึกเพิ่มเติม · ไม่บังคับ<\u002Fspan><\u002Fspan>\n<input value=\"{{ draftNote }}\" sc-camel-on-change=\"{{ onNote }}\" placeholder=\"e.g. price board photographed 2 Sep\" style=\"border:1.5px solid var(--hair);border-radius:4px;padding:8px 10px;font:400 13px var(--sans)\">\n<\u002Flabel>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:6px;border-top:1px solid var(--hair)\">\n<sc-if value=\"{{ isCreateMode }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ draftSubmit }}\" style=\"border:1.5px solid var(--signal);background:var(--signal);color:#FDFDFC;border-radius:4px;padding:12px 20px;font:700 14px var(--sans)\"><span data-l=\"en\">Publish lab<\u002Fspan><span data-l=\"th\">เผยแพร่ร้าน<\u002Fspan><\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ isEditMode }}\" hint-placeholder-val=\"{{ true }}\">\n<button sc-camel-on-click=\"{{ draftSubmit }}\" style=\"border:1.5px solid var(--signal);background:var(--signal);color:#FDFDFC;border-radius:4px;padding:12px 20px;font:700 14px var(--sans)\"><span data-l=\"en\">Save — goes live now<\u002Fspan><span data-l=\"th\">บันทึก — ขึ้นทันที<\u002Fspan><\u002Fbutton>\n<\u002Fsc-if>\n<button sc-camel-on-click=\"{{ back }}\" style=\"padding:12px 8px;font:700 14px var(--sans);color:var(--ash)\"><span data-l=\"en\">Cancel<\u002Fspan><span data-l=\"th\">ยกเลิก<\u002Fspan><\u002Fbutton>\n<div style=\"flex:1\"><\u002Fdiv>\n<sc-if value=\"{{ isCreateMode }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font:400 11px var(--sans);color:var(--faint)\">{{ requiredLine }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ isEditMode }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font:400 11px var(--sans);color:var(--faint)\"><span data-l=\"en\">{{ draftDiffLine }}<\u002Fspan><span data-l=\"th\">{{ draftDiffLineTh }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-i ets after dark — the grain gets loud, the color stays honest.', noteTh: 'ฟิล์มภาพยนตร์ทังสเตนที่ดันสตอปเพื่อถ่ายกลางคืน เกรนหยาบขึ้นแต่สียังตรง' }\n    ];\n  }\n\n  /* ---- helpers ---- */\n  procLabel(k) { const f = PROCS.filter(function (p) { return p.k === k; })[0]; return f ? f.label : k; }\n  procList(ks) { const self = this; return (ks || []).map(function (k) { return { k: k, label: self.procLabel(k) }; }); }\n  lab(id) { return this.state.labs.filter(function (l) { return l.id === id; })[0]; }\n  stock(id) { return this.stocks.filter(function (s) { return s.id === id; })[0] || this.stocks[0]; }\n  samples(stockId) {\n    const st = this.stock(stockId);\n    const fmts = st.fmts && st.fmts.length ? st.fmts : ['135'];\n    const n = st.sampleCount != null ? st.sampleCount : 6;\n    const out = [];\n    for (let i = 0; i < n; i++) {\n      out.push({\n        id: stockId + '-p' + (i + 1),\n        stockId: stockId,\n        proc: st.proc,\n        ratio: RATIOS[i % 3],\n        fmt: fmts[i % fmts.length],\n        camera: CAMERAS[(i + stockId.length) % CAMERAS.length],\n        scanner: SCANNERS[i % 3],\n        by: '@' + ['nid.shoots', 'grain.eater', 'fuji.every.day', 'somchai.film', 'soi.dog.club', 'ploy.on.film'][i]\n      });\n    }\n    return out;\n  }\n  photo(id) {\n    if (!id) return null;\n    const sid = id.split('-')[0];\n    return this.samples(sid).filter(function (p) { return p.id === id; })[0];\n  }\n  /* ---- Photo/Photobook reference model (gap-plan Phase 1) ---- */\n  bookPhotoIds(bookId) {\n    const conn = this.state.connections;\n    const deleted = this.state.deletedPhotoIds;\n    return Object.keys(conn).filter(function (id) {\n      return conn[id].indexOf(bookId) > -1 && deleted.indexOf(id) < 0;\n    });\n  }\n  knownPhotoIds() {\n    return Object.keys(this.state.connections).filter(function (id) {\n      return this.state.deletedPhotoIds.indexOf(id) < 0;\n    }, this);\n  }\n  uploadedCount(handle) {\n    const self = this;\n    retu ndle) + ' / 50 · Connections are unlimited',\n      profileCapLineTh: 'ภาพอัปโหลดต้นฉบับ ' + this.uploadedCount(viewedHandle) + ' / 50 · การเชื่อมภาพไม่จำกัด',\n      profileSort: s.profileSort,\n      profileSortTh: s.profileSort === 'newest' ? 'ใหม่สุด' : 'เก่าสุด',\n      toggleProfileSort: function () { self.setState({ profileSort: s.profileSort === 'newest' ? 'oldest' : 'newest' }); },\n      shareProfile: function () { self.say(self.tt('Share link copied — placeholder in this prototype.', 'คัดลอกลิงก์แล้ว — ใช้งานจริงไม่ได้ในต้นแบบนี้')); },\n      books: profileBookCards,\n      newBook: function () { self.newBookAction(); },\n      book: {\n        title: book.title, titleTh: book.titleTh, note: book.note, noteTh: book.noteTh, hasNote: !!book.note,\n        meta: bookPhotoObjs.length + (bookPhotoObjs.length === 1 ? ' Photo' : ' Photos') + ' · ' + bookPhotoObjs.filter(function (p) { return p.by !== DEFAULT_OWNER_HANDLE; }).length + ' Connected',\n        metaTh: bookPhotoObjs.length + ' ภาพ · เชื่อม ' + bookPhotoObjs.filter(function (p) { return p.by !== DEFAULT_OWNER_HANDLE; }).length + ' ภาพ'\n      },\n      bookPhotos: bookPhotos,\n      openBookOwnerProfile: function () { self.goToProfile(DEFAULT_OWNER_HANDLE); },\n      shareBook: function () { self.say(self.tt('Share link copied — placeholder in this prototype.', 'คัดลอกลิงก์แล้ว — ใช้งานจริงไม่ได้ในต้นแบบนี้')); },\n\n      authReason: s.authReason || 'Browsing needs nothing. Contributing needs a Google account.',\n      authReasonTh: s.authReasonTh || 'เปิดดูไม่ต้องมีบัญชี แต่การเพิ่มข้อมูลต้องมีบัญชี Google',\n      continueWithGoogle: function () {\n        const then = s.pending;\n        self.setState({ user: DEFAULT_OWNER_HANDLE, pending: null });\n        self.back();\n        if (then) setTimeout(then, 40);\n        self.say(self.tt('Signed in with Google.', 'เข้าสู่ระบบด้วย Google แล้ว'));\n      },\n\n      toast: s.toast,\n      hideToast: function () { self.setState({ toast: null }); }\n
