document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"8e69a178-5968-423b-a0b5-f98fba0f9c5b\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\"><meta name=\"design_doc_mode\" content=\"canvas\"><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\"><style>/* latin-ext */\n@font-face {\n  font-family: 'Architects Daughter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cae619fb-86c3-47cf-be50-36761f348017\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Architects Daughter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fd3b8470-78c7-4a7c-b1a2-881358973051\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* thai */\n@font-face {\n  font-family: 'Noto Sans Thai';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"ff22b183-89d6-41bf-9d11-b78e6aecaee4\") format('woff2');\n  unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Noto Sans Thai';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"259e2059-ea64-44e5-a1b2-ea360e2b5e86\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Noto Sans Thai';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"aae7b184-45b9-4a71-9f6a-3e979003b8cd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* thai */\n@font-face {\n  font-family: 'Noto Sans Thai';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"ff22b183-89d6-41bf-9d11-b78e6aecaee4\") format('woff2');\n  unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Noto Sans Thai';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"259e2059-ea64-44e5-a1b2-ea360e2b5e86\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Noto Sans Thai';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"aae7b184-45b9-4a71-9f6a-3e979003b8cd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle><style>body{margin:0;background:#f0eee9;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#2a78d6}a:hover{color:#1a5aa8}<\u002Fstyle><\u002Fhelmet>\n<section id=\"t2\" style=\"padding:40px 44px 48px;font-family:'Architects Daughter','Noto Sans Thai',cursive;border-bottom:1px solid rgba(0,0,0,.15)\">\n<div style=\"display:flex;align-items:baseline;gap:10px;margin:0 0 8px\">\n<a href=\"#t2\" style=\"font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none\">2<\u002Fa>\n<span style=\"font:400 15px/1.2 'Architects Daughter',cursive;color:#1a1a1a\">Gap fill — location entry, accounts, edit history, structured inputs, system states<\u002Fspan>\n<\u002Fdiv>\n<p style=\"max-width:900px;margin:0 0 26px;font:400 13px/1.6 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\">Same grayscale structural pass as <a href=\"#t1\">1<\u002Fa>. Covers the six things the updated PRD still has no screen for — the pre-location entry point, the account flow (new + returning), edit history &amp; revert, the matrix-shaped optional inputs, the closed / conflict paths, and loading / error / overflow states. Notes marked <b style=\"color:#2a78d6\">⚑<\u002Fb> are places the design had to decide something the PRD doesn't say.<\u002Fp>\n\n<div style=\"font:400 13px ui-monospace,Menlo,monospace;color:#1a1a1a;padding:6px 0 14px;border-top:1px solid rgba(0,0,0,.15)\">A1 · LOCATION ENTRY &amp; PERMISSION<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:0 0 40px\">\n\n<div id=\"2a\" style=\"flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\"><a href=\"#2a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none\">2a<\u002Fa>Location entry — first run, locating, denied, manual area search · mobile + TH<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:24px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">FIRST RUN · nothing asked yet<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #ddd\">\n<div style=\"width:66px;height:20px;border:1.5px solid #111;display:grid;place-items:center;font:400 10px ui-monospace,monospace\">GRAINS<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv>\n<div style=\"display:flex;border:1.5px solid #111\"><div style=\"padding:2px 6px;font:400 10px ui-monospace,monospace\">TH<\u002Fdiv><div style=\"padding:2px 6px;background:#111;color:#fff;font:400 10px ui-monospace,monospace\">EN<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:30px 20px 22px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"font:400 18px/1.3 ui-monospace,monospace\">Find a film lab<\u002Fdiv>\n<div style=\"font:400 11px/1.6 ui-monospace,monospace;color:#666\">Labs near you, or anywhere in Thailand. No account needed to browse.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:11px 12px;font:400 12px ui-monospace,monospace;display:flex;align-items:center;gap:8px\"><span style=\"font-size:13px\">⌖<\u002Fspan> Use my location<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:11px 12px;font:400 12px ui-monospace,monospace;display:flex;align-items:center;gap:8px\"><span style=\"font-size:13px\">⌕<\u002Fspan> Search an area or city<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 10px/1.5 ui-monospace,monospace;color:#888;border-top:1px dashed #ccc;padding-top:12px\">Both are equal weight. The second is not a fallback — it is the whole entry point for anyone who doesn't want to share a location.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid #ddd;display:flex\">\n<div style=\"flex:1;padding:9px 0;text-align:center;font:400 9px ui-monospace,monospace;border-right:1px solid #eee\">Labs<\u002Fdiv>\n<div style=\"flex:1;padding:9px 0;text-align:center;font:400 9px ui-monospace,monospace;border-right:1px solid #eee;color:#999\">Films<\u002Fdiv>\n<div style=\"flex:1;padding:9px 0;text-align:center;font:400 9px ui-monospace,monospace;border-right:1px solid #eee;color:#999\">+<\u002Fdiv>\n<div style=\"flex:1;padding:9px 0;text-align:center;font:400 9px ui-monospace,monospace;color:#999\">Profile<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>33<\u002Fb> — PRD §Discovery asks auto-locate to be the default <i>and<\u002Fi> manual search to be first-class. Those two conflict if the app fires the OS prompt on cold open, so the entry point is one screen with two equal buttons: the OS dialog is only ever triggered by an explicit tap. <b>⚑<\u002Fb> PRD doesn't say whether the prompt fires unprompted — this proposes it never does.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">LOCATING · request in flight<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px\">\n<div style=\"width:16px;height:16px;border:1.5px dashed #111;border-radius:50%\"><\u002Fdiv>\n<div style=\"font:400 12px ui-monospace,monospace;color:#888\">Locating…<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;text-decoration:underline\">Cancel<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;display:flex;gap:6px\">\n<div style=\"height:22px;width:74px;background:#eee\"><\u002Fdiv>\n<div style=\"height:22px;width:60px;background:#eee\"><\u002Fdiv>\n<div style=\"height:22px;width:54px;background:#eee\"><\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ skeleton }}\" as=\"s\" hint-placeholder-count=\"4\">\n<div style=\"padding:14px;border-bottom:1px solid #eee;display:flex;gap:12px\">\n<div style=\"width:64px;height:64px;flex:none;background:#eee\"><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n<div style=\"height:12px;width:70%;background:#eee\"><\u002Fdiv>\n<div style=\"height:9px;width:45%;background:#f0f0f0\"><\u002Fdiv>\n<div style=\"height:9px;width:80%;background:#f0f0f0\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"padding:12px 14px;text-align:center;font:400 10px ui-monospace,monospace;color:#888\">Skeleton keeps the result-row shape, so the list doesn't jump when data lands<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>34<\u002Fb> — Two waits stack here (OS fix, then the radius query) and the user can't tell them apart, so there is one label and one Cancel. Cancel drops to the area-search screen rather than to a blank state.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">DENIED / UNAVAILABLE · not an error page<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:9px 12px;border-bottom:1.5px solid #111;background:#f4f4f4;font:400 10px/1.5 ui-monospace,monospace\">Location is off. Search an area instead — or turn it on in Settings.<\u002Fdiv>\n<div style=\"padding:14px;border-bottom:1px solid #ddd\">\n<div style=\"border:1.5px solid #111;padding:9px 10px;font:400 11px ui-monospace,monospace;color:#888\">⌕ area, district or city<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:10px 14px 4px;font:400 9px ui-monospace,monospace;color:#888\">POPULAR AREAS<\u002Fdiv>\n<sc-for list=\"{{ areaResults }}\" as=\"a\" hint-placeholder-count=\"4\">\n<div style=\"padding:9px 14px;border-bottom:1px solid #eee;display:flex;align-items:baseline;gap:8px\">\n<div style=\"flex:1;min-width:0\">\n<div style=\"font:400 12px ui-monospace,monospace\">{{ a.en }}<\u002Fdiv>\n<div style=\"font:400 11px 'Noto Sans Thai',sans-serif;color:#666\">{{ a.th }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888;white-space:nowrap\">{{ a.meta }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"padding:12px 14px;display:flex;justify-content:center\"><div style=\"border:1.5px solid #111;padding:7px 12px;font:400 10px ui-monospace,monospace\">⌖ Try my location again<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>35<\u002Fb> — Denied, unsupported and timed-out all land on the same screen: the area search, with a one-line banner above it. Retry stays available because the OS permission can change outside the app. No modal, no dead end, no \"enable location to continue\".<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">MANUAL AREA SEARCH · typed, with recents<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1.5px solid #111;display:flex;align-items:center;gap:8px\">\n<div style=\"font:400 12px ui-monospace,monospace\">‹<\u002Fdiv>\n<div style=\"flex:1;border:1.5px solid #111;padding:7px 9px;font:400 11px ui-monospace,monospace\">phra kha<span style=\"opacity:.35\">|<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:9px 14px;border-bottom:1px solid #eee;font:400 12px ui-monospace,monospace\"><b>Phra Kha<\u002Fb>nong, Bangkok<\u002Fdiv>\n<div style=\"padding:9px 14px;border-bottom:1px solid #eee;font:400 12px ui-monospace,monospace\"><b>Phra Kha<\u002Fb>nong Nuea, Bangkok<\u002Fdiv>\n<div style=\"padding:14px;border-bottom:1px solid #ddd;background:#fafafa\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888;margin-bottom:7px\">RECENT<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:5px\">\n<div style=\"border:1px solid #111;padding:3px 7px;font:400 10px ui-monospace,monospace\">Phaya Thai<\u002Fdiv>\n<div style=\"border:1px solid #111;padding:3px 7px;font:400 10px ui-monospace,monospace\">Chiang Mai<\u002Fdiv>\n<div style=\"border:1px solid #111;padding:3px 7px;font:400 10px ui-monospace,monospace\">⌖ Near me<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:11px 14px;font:400 10px/1.5 ui-monospace,monospace;color:#666\">Selecting an area sets the search centre and keeps the ≤ 5 km radius chip. Thai and Latin place names both match the same query.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>36<\u002Fb> — <b>⚑<\u002Fb> PRD is silent on place identity. This treats an area as a <i>search centre + radius<\u002Fi>, not a browsable place entity — so there is still no district page, and <a href=\"#1e\">1e<\u002Fa>'s breadcrumb should drop its district segment or become a filter pill.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">TH · first run<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #ddd\">\n<div style=\"width:66px;height:20px;border:1.5px solid #111;display:grid;place-items:center;font:400 10px ui-monospace,monospace\">GRAINS<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv>\n<div style=\"display:flex;border:1.5px solid #111\"><div style=\"padding:2px 6px;background:#111;color:#fff;font:400 10px ui-monospace,monospace\">TH<\u002Fdiv><div style=\"padding:2px 6px;font:400 10px ui-monospace,monospace\">EN<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:30px 20px 22px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"font:400 20px/1.45 'Noto Sans Thai',sans-serif\">หาร้านล้างฟิล์ม<\u002Fdiv>\n<div style=\"font:400 12px/1.8 'Noto Sans Thai',sans-serif;color:#666\">ร้านใกล้คุณ หรือที่ไหนก็ได้ในไทย · ดูได้เลยไม่ต้องเข้าสู่ระบบ<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:11px 12px;font:400 13px/1.5 'Noto Sans Thai',sans-serif\">⌖ ใช้ตำแหน่งของฉัน<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:11px 12px;font:400 13px/1.5 'Noto Sans Thai',sans-serif\">⌕ ค้นหาพื้นที่หรือจังหวัด<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>37<\u002Fb> — Thai copy is shorter but the buttons grow ~3px taller (tone marks + descenders), per the height-not-character-count rule in <a href=\"#1a\">1a<\u002Fa>. Both buttons keep identical height in both locales so the pair never reads as primary/secondary by accident.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font:400 13px ui-monospace,Menlo,monospace;color:#1a1a1a;padding:6px 0 14px;border-top:1px solid rgba(0,0,0,.15)\">A2 · ACCOUNTS — SIGN IN / SIGN UP<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:0 0 40px\">\n\n<div id=\"2b\" style=\"flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\"><a href=\"#2b\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none\">2b<\u002Fa>Accounts — gate → method → new user vs. returning · mobile, TH, desktop modal<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:24px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">1 · GATE → 2 · METHOD SHEET<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:22px 14px;background:#f6f6f6;font:400 10px ui-monospace,monospace;color:#aaa;text-align:center\">the action you tapped, dimmed behind the sheet<br>(add lab · suggest edit · endorse badge · upload)<\u002Fdiv>\n<div style=\"border-top:1.5px solid #111;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"width:34px;height:4px;background:#ddd;border-radius:2px;align-self:center\"><\u002Fdiv>\n<div style=\"font:400 15px/1.35 ui-monospace,monospace\">Sign in to contribute<\u002Fdiv>\n<div style=\"font:400 11px/1.6 ui-monospace,monospace;color:#666\">Browsing never needs an account. Adding or editing does, so every change can be attributed and traced.<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:9px 12px;font:400 11px ui-monospace,monospace;text-align:center\">Continue<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;text-decoration:underline;color:#444;text-align:center\">Keep browsing<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:22px 14px;background:#f6f6f6;font:400 10px ui-monospace,monospace;color:#aaa;text-align:center\">same action, still dimmed — never navigated away from<\u002Fdiv>\n<div style=\"border-top:1.5px solid #111;padding:16px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;align-items:baseline;gap:8px\"><div style=\"font:400 14px ui-monospace,monospace;flex:1\">Continue as…<\u002Fdiv><div style=\"font:400 13px ui-monospace,monospace\">✕<\u002Fdiv><\u002Fdiv>\n<sc-for list=\"{{ authMethods }}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"border:1.5px solid #111;padding:10px 11px;display:flex;align-items:center;gap:9px\">\n<div style=\"width:16px;height:16px;border:1.5px solid #111;flex:none\"><\u002Fdiv>\n<div style=\"font:400 11px ui-monospace,monospace;flex:1\">{{ m.label }}<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">{{ m.sub }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#888;border-top:1px dashed #ccc;padding-top:10px\">One sheet for both sign in and sign up — we don't know which you are until the provider answers. New accounts continue to handle setup; returning accounts go straight back to the action.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>38<\u002Fb> — <b>⚑<\u002Fb> PRD says contributions need a logged-in, attributable account and nothing more, so this proposes <i>no passwords at all<\u002Fi>: three OAuth providers plus a one-time email link. LINE leads because it already leads in <a href=\"#1d\">1d<\u002Fa>'s contact row. There is no separate \"Sign up\" route to choose — a wrong guess there is the most common drop-off in a flow like this.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">3 · NEW USER · claim a handle (only new-account step)<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;display:flex;align-items:baseline;gap:8px\"><div style=\"font:400 12px ui-monospace,monospace;flex:1\">Pick your handle<\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace;color:#888\">1 / 1<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:16px 14px;display:flex;flex-direction:column;gap:14px\">\n<div>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888;margin-bottom:6px\">HANDLE <span style=\"color:#111\">*<\u002Fspan><\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:9px 10px;font:400 12px ui-monospace,monospace\">@nan-shoots-film<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#444;margin-top:5px\">✓ available · this becomes your public profile at /u/@nan-shoots-film<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888;margin-bottom:6px\">DISPLAY NAME <span style=\"color:#888\">(optional)<\u002Fspan><\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:9px 10px;font:400 12px ui-monospace,monospace;color:#888\">ชื่อที่แสดง / display name<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px dashed #999;padding:9px 10px;font:400 9px/1.6 ui-monospace,monospace;color:#555\">Every lab edit you make is public and permanent in the lab's history under this handle. There is no anonymous contribution and no review queue.<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:10px 12px;font:400 11px ui-monospace,monospace;text-align:center\">Create account &amp; continue<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>39<\u002Fb> — Sign-up is exactly one screen, and it exists only because a handle can't be derived safely from an OAuth name and because <a href=\"#1j\">1j<\u002Fa>'s profile URL needs it. Everything else on a profile (bio, avatar, TH name) stays empty and fillable later. <b>⚑<\u002Fb> PRD doesn't define handle rules — proposed: lowercase, unique, changeable once, old handle not reissued.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">EMAIL-LINK PATH · 2 states<\u002Fdiv>\n<div style=\"width:262px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center\">\n<div style=\"width:44px;height:44px;border:1.5px solid #111\"><\u002Fdiv>\n<div style=\"font:400 13px/1.4 ui-monospace,monospace\">Check your email<\u002Fdiv>\n<div style=\"font:400 10px/1.6 ui-monospace,monospace;color:#666\">A one-time link is on its way to <b>n••••@mail.com<\u002Fb>. It expires in 15 minutes.<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;text-decoration:underline;color:#444\">Resend · use another method<\u002Fdiv>\n<div style=\"border-top:1px dashed #ccc;padding-top:10px;font:400 9px/1.6 ui-monospace,monospace;color:#888\">Your draft is held on this device. Opening the link in another browser signs that one in — the draft stays here and finishes here.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:262px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center\">\n<div style=\"width:44px;height:44px;border:1.5px dashed #111\"><\u002Fdiv>\n<div style=\"font:400 13px/1.4 ui-monospace,monospace\">This link has expired<\u002Fdiv>\n<div style=\"font:400 10px/1.6 ui-monospace,monospace;color:#666\">Links last 15 minutes and work once. Nothing was lost.<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:8px 12px;font:400 11px ui-monospace,monospace\">Send a new link<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:262px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>40<\u002Fb> — The cross-device case is the reason this state needs copy at all: a one-time link opened on a laptop can't carry the phone's half-finished lab form. Stated plainly rather than silently failing.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">4 · RETURNING · 5 · RESUME · SIGNED-IN CHROME<\u002Fdiv>\n<div style=\"width:262px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:20px 16px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<div style=\"width:38px;height:38px;border:1.5px solid #111;border-radius:50%;background:repeating-linear-gradient(45deg,#e8e8e8 0 5px,#f4f4f4 5px 10px)\"><\u002Fdiv>\n<div><div style=\"font:400 12px ui-monospace,monospace\">@placeholder-user<\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace;color:#888\">last signed in 12 Aug · LINE<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:9px 12px;font:400 11px ui-monospace,monospace;text-align:center\">Continue as @placeholder-user<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;text-decoration:underline;color:#444;text-align:center\">Use a different account<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#888;border-top:1px dashed #ccc;padding-top:10px\">Returning users skip the method sheet entirely — one tap, no handle step, straight back to the pending action.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:262px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:9px 12px;background:#111;color:#fff;font:400 10px/1.5 ui-monospace,monospace\">✓ Signed in as @you — picking up where you left off<\u002Fdiv>\n<div style=\"padding:12px;border-bottom:1px solid #ddd;display:flex;align-items:baseline;gap:8px\"><div style=\"font:400 12px ui-monospace,monospace;flex:1\">Add a lab<\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace;color:#888\">3 / 4<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:14px;display:flex;flex-direction:column;gap:9px\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">CHEMICAL PROCESS *<\u002Fdiv>\n<div style=\"display:flex;gap:5px;flex-wrap:wrap\">\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:4px 8px;font:400 10px ui-monospace,monospace\">✓ C-41<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:4px 8px;font:400 10px ui-monospace,monospace\">B&amp;W<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:4px 8px;font:400 10px ui-monospace,monospace\">E-6<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#666;border-top:1px dashed #ccc;padding-top:9px\">Name and location from steps 1–2 survived the sign-in. Nothing was re-typed.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:262px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"display:flex;align-items:center;gap:8px;padding:10px 12px\">\n<div style=\"width:60px;height:18px;border:1.5px solid #111;display:grid;place-items:center;font:400 9px ui-monospace,monospace\">GRAINS<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv>\n<div x\">\n<div style=\"font:400 15px/1.5 'Noto Sans Thai',sans-serif\">เข้าสู่ระบบเพื่อร่วมแก้ไข<\u002Fdiv>\n<sc-for list=\"{{ authMethodsTh }}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"border:1.5px solid #111;padding:10px 11px;display:flex;align-items:center;gap:9px\">\n<div style=\"width:16px;height:16px;border:1.5px solid #111;flex:none\"><\u002Fdiv>\n<div style=\"font:400 12px/1.6 'Noto Sans Thai',sans-serif;flex:1\">{{ m.label }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"font:400 10px/1.7 'Noto Sans Thai',sans-serif;color:#888\">การแก้ไขทุกครั้งจะบันทึกชื่อผู้แก้ไขไว้ถาวร<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:262px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>42<\u002Fb> — Provider names stay Latin (they're brands, like the process codes in <a href=\"#1a\">1a<\u002Fa>) while the connective verb translates — so each row keeps a fixed-width logo slot and a flexible label slot in both locales.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">DESKTOP 1280 · modal over the page, never a route<\u002Fdiv>\n<div style=\"width:640px;border:1.5px solid #111;background:#fff;overflow:hidden\">\n<div style=\"display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid #ddd\">\n<div style=\"width:66px;height:20px;border:1.5px solid #111;display:grid;place-items:center;font:400 10px ui-monospace,monospace\">GRAINS<\u002Fdiv>\n<div style=\"display:flex;gap:12px;font:400 10px ui-monospace,monospace;color:#666\"><span>Labs<\u002Fspan><span>Films<\u002Fspan><span>Community<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:3px 8px;font:400 10px ui-monospace,monospace\">+ Contribute<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;height:330px;background:#f6f6f6\">\n<div style=\"padding:14px 16px;font:400 10px ui-monospace,monospace;color:#bbb\">lab detail page stays mounted and readable behind the modal — scroll position, filters and form values all survive<\u002Fdiv>\n<div style=\"position:absolute;left:170px;top:38px;width:300px;border:1.5px solid #111;background:#fff;padding:18px 18px 20px;display:flex;flex-direction:column;gap:11px\">\n<div style=\"display:flex;align-items:baseline;gap:8px\"><div style=\"font:400 14px ui-monospace,monospace;flex:1\">Continue as…<\u002Fdiv><div style=\"font:400 13px ui-monospace,monospace\">✕<\u002Fdiv><\u002Fdiv>\n<div style=\"font:400 10px/1.6 ui-monospace,monospace;color:#666\">You were editing <b>Placeholder Film Lab<\u002Fb> · 2 changes pending<\u002Fdiv>\n<sc-for list=\"{{ authMethods }}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"border:1.5px solid #111;padding:8px 10px;display:flex;align-items:center;gap:9px\">\n<div style=\"width:14px;height:14px;border:1.5px solid #111;flex:none\"><\u002Fdiv>\n<div style=\"font:400 11px ui-monospace,monospace;flex:1\">{{ m.label }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:640px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>43<\u002Fb> — Structural difference, not reflow: mobile is a bottom sheet on a dimmed screen, desktop is a centred modal over a fully mounted page — but both keep the interrupted action alive and name it in the modal, which is what makes \"keep browsing\" a safe out. Neither is a <code>/login<\u002Fcode> page, so there's no post-login redirect to guess.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font:400 13px ui-monospace,Menlo,monospace;color:#1a1a1a;padding:6px 0 14px;border-top:1px solid rgba(0,0,0,.15)\">A3 · EDIT HISTORY &amp; REVERT<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:0 0 40px\">\n\n<div id=\"2c\" style=\"flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\"><a href=\"#2c\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none\">2c<\u002Fa>Edit history &amp; revert — the destination for 4 existing links · mobile + desktop<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:24px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">MOBILE · full log<\u002Fdiv>\n<div style=\"width:330px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1.5px solid #111;display:flex;align-items:baseline;gap:9px\">\n<div style=\"font:400 12px ui-monospace,monospace\">‹<\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font:400 13px ui-monospace,monospace\">Edit history<\u002Fdiv><div style=\"font:400 10px ui-monospace,monospace;color:#666\">Placeholder Film Lab · 14 edits<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:9px 14px;border-bottom:1px solid #ddd;display:flex;gap:6px\">\n<div style=\"border:1.5px solid #111;padding:3px 8px;font:400 10px ui-monospace,monospace\">All fields ▾<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:3px 8px;font:400 10px ui-monospace,monospace\">Anyone ▾<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ historyEntries }}\" as=\"h\" hint-placeholder-count=\"5\">\n<div style=\"padding:12px 14px;border-bottom:1px solid #eee;display:flex;flex-direction:column;gap:6px\">\n<div style=\"display:flex;align-items:baseline;gap:8px\">\n<div style=\"font:400 11px ui-monospace,monospace;flex:1\">{{ h.who }}<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888;white-space:nowrap\">{{ h.when }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">{{ h.field }}<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap\">\n<div style=\"border:1px solid #bbb;padding:2px 6px;font:400 10px ui-monospace,monospace;color:#888;text-decoration:line-through\">{{ h.from }}<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace\">→<\u002Fdiv>\n<div style=\"border:1px solid #111;padding:2px 6px;font:400 10px ui-monospace,monospace\">{{ h.to }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 9px/1.5 ui-monospace,monospace;color:#666\"><sc-if value=\"{{ h.note }}\" hint-placeholder-val=\"{{ true }}\">“{{ h.note }}”<\u002Fsc-if><\u002Fdiv>\n<div style=\"align-self:flex-start;border:1px solid #111;padding:2px 8px;font:400 9px ui-monospace,monospace\">{{ h.act }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"padding:12px 14px;text-align:center;font:400 10px ui-monospace,monospace;color:#666\">↓ 9 older edits · created 2 Jun by @first-user<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:330px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>44<\u002Fb> — One entry = one field change, matching the field-level diff model in the PRD's Edit Lab section — so a 3-field edit reads as 3 traceable lines and each can be reverted alone. Before→after is shown inline because \"who changed what\" is unusable without the values. The optional contributor note sits under the diff, as the only human explanation in the system.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">REVERT · confirm → result<\u002Fdiv>\n<div style=\"width:290px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u0 8px\"><div style=\"font:400 11px ui-monospace,monospace;flex:1\">@you <span style=\"color:#666\">· reverted<\u002Fspan><\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace;color:#888\">just now<\u002Fdiv><\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">PRICING · C-41 · 135<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:7px\"><div style=\"border:1px solid #bbb;padding:2px 6px;font:400 10px ui-monospace,monospace;color:#888;text-decoration:line-through\">฿200<\u002Fdiv><div style=\"font:400 10px ui-monospace,monospace\">→<\u002Fdiv><div style=\"border:1px solid #111;padding:2px 6px;font:400 10px ui-monospace,monospace\">฿180<\u002Fdiv><\u002Fdiv>\n<div style=\"font:400 9px/1.5 ui-monospace,monospace;color:#666\">“reverts @placeholder-user, 3 Sep”<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:12px 14px;font:400 9px/1.6 ui-monospace,monospace;color:#666\">The reverted entry stays in place below, unmarked. A revert is an ordinary edit that happens to restore an old value — not a moderation action, because there is no moderator.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:290px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>45<\u002Fb> — <b>⚑<\u002Fb> PRD says bad edits can be \"traced and reverted\" and defines no permissions. This proposes revert = a normal edit, available to any logged-in user, appended not rewound. That keeps trust-by-default consistent, but it also means edit wars have no backstop — worth a stakeholder decision before build.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">JUST-CREATED LAB · near-empty log<\u002Fdiv>\n<div style=\"width:250px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1.5px
