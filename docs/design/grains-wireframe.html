p:12px\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">CURRENT VALUES<\u002Fdiv>\n<div><div style=\"font:400 9px ui-monospace,monospace;color:#888\">C-41 · 135<\u002Fdiv><div style=\"font:400 12px ui-monospace,monospace\">฿200<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:400 9px ui-monospace,monospace;color:#888\">HOURS · SUN<\u002Fdiv><div style=\"font:400 12px ui-monospace,monospace\">12:00 – 17:00<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:400 9px ui-monospace,monospace;color:#888\">SCANNER<\u002Fdiv><div style=\"font:400 12px ui-monospace,monospace\">Noritsu HS-1800<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:1px dashed #ccc;padding-top:11px;font:400 9px/1.6 ui-monospace,monospace;color:#666\">The rail shows what the lab says <i>now<\u002Fi>, so a revert can be judged without leaving the log.<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:7px 10px;font:400 10px ui-monospace,monospace;text-align:center\">Back to the lab<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:700px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>47<\u002Fb> — This screen is the destination for all four existing links (<a href=\"#1d\">1d<\u002Fa>, <a href=\"#1e\">1e<\u002Fa>, <a href=\"#1g\">1g<\u002Fa> catalog, and the success screen in <a href=\"#1h\">1h<\u002Fa>) plus \"My contributions\" from <a href=\"#2b\">2b<\u002Fa> — filtered to one contributor in that last case, same screen otherwise.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font:400 13px ui-monospace,Menlo,monospace;color:#1a1a1a;padding:6px 0 14px;border-top:1px solid rgba(0,0,0,.15)\">A4 · MATRIX-SHAPED INPUTS · A5 · CLOSED &amp; CONFLICT<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:0 0 40px\">\n\n<div id=\"2d\" style=\"flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\"><a href=\"#2d\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none\">2d<\u002Fa>The four inputs that aren't text fields — pricing, hours, status override, atmosphere photo<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:24px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">PRICING · process × format × mode<\u002Fdiv>\n<div style=\"width:330px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1.5px solid #111;display:flex;align-items:baseline;gap:9px\"><div style=\"font:400 12px ui-monospace,monospace\">✕<\u002Fdiv><div style=\"flex:1;font:400 12px ui-monospace,monospace\">Pricing<\u002Fdiv><div style=\"font:400 10px ui-monospace,monospace;text-decoration:underline\">Save<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;display:flex;gap:6px;align-items:center\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">MODE<\u002Fdiv>\n<div style=\"display:flex;border:1.5px solid #111\"><div style=\"padding:3px 8px;background:#111;color:#fff;font:400 9px ui-monospace,monospace\">Dev + scan<\u002Fdiv><div style=\"padding:3px 8px;font:400 9px ui-monospace,monospace\">Dev only<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;padding:8px 14px 6px;gap:8px;border-bottom:1px solid #eee\">\n<div style=\"width:56px;font:400 9px ui-monospace,monospace;color:#888\">PROCESS<\u002Fdiv>\n<div style=\"flex:1;font:400 9px ui-monospace,monospace;color:#888;text-align:center\">135<\u002Fdiv>\n<div style=\"flex:1;font:400 9px ui-monospace,monospace;color:#888;text-align:center\">120<\u002Fdiv>\n<div style=\"width:74px;font:400 9px ui-monospace,monospace;color:#888;text-align:right\">TURNAROUND<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ priceEdit }}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;padding:8px 14px;gap:8px;align-items:center;border-bottom:1px solid #eee\">\n<div style=\"width:56px;font:400 11px ui-monospace,monospace\">{{ r.proc }}<\u002Fdiv>\n<div style=\"flex:1;border:1.5px solid #111;padding:5px 6px;font:400 11px ui-monospace,monospace;text-align:center\">{{ r.p135 }}<\u002Fdiv>\n<div style=\"flex:1;border:1.5px solid #111;padding:5px 6px;font:400 11px ui-monospace,monospace;text-align:center\">{{ r.p120 }}<\u002Fdiv>\n<div style=\"width:74px;border:1.5px solid #111;padding:5px 6px;font:400 9px ui-monospace,monospace;text-align:right\">{{ r.turn }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;display:flex;flex-direction:column;gap:6px\">\n<div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:14px;height:14px;border:1.5px solid #111;background:#111\"><\u002Fdiv><div style=\"font:400 10px ui-monospace,monospace\">ECN-2 — not offered here<\u002Fdiv><\u002Fdiv>\n<div style=\"font:400 9px/1.5 ui-monospace,monospace;color:#666\">Ticking \"not offered\" writes an explicit “—” instead of leaving cells blank, so <a href=\"#1d\" style=\"color:#666\">1d<\u002Fa> can tell \"no ECN-2\" apart from \"nobody has entered ECN-2 prices yet\".<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:11px 14px;font:400 9px/1.6 ui-monospace,monospace;color:#666\">Only touched cells submit, per the field-level diff rule — editing C-41/135 can't clobber someone else's E-6 row.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:330px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>48<\u002Fb> — The PRD lists \"pricing per process\" as one optional field; it's really a 4 × 2 × 2 grid with a per-row turnaround. Kept as one matrix screen rather than 16 form fields, and mode is a top-level toggle because dev-only and dev+scan are two price boards, not two columns. <b>⚑<\u002Fb> PRD doesn't say whether both modes are required or one is enough — proposed: either alone publishes.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">WEEKLY HOURS · incl. split shift &amp; 24h<\u002Fdiv>\n<div style=\"width:330px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1.5px solid #111;display:flex;align-items:baseline;gap:9px\"><div style=\"font:400 12px ui-monospace,monospace\">✕<\u002Fdiv><div style=\"flex:1;font:400 12px ui-monospace,monospace\">Weekly hours<\u002Fdiv><div style=\"font:400 10px ui-monospace,monospace;text-decoration:underline\">Save<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:9px 14px;border-bottom:1px solid #ddd;display:flex;gap:6px\">\n<div style=\"border:1.5px solid #111;padding:3px 8px;font:400 9px ui-monospace,monospace\">Copy Mon → all<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:3px 8px;font:400 9px ui-monospace,monospace\">Open 24h<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ hoursEdit }}\" as=\"h\" hint-placeholder-count=\"7\">\n<div style=\"padding:7px 14px;border-bottom:1px solid #eee;display:flex;flex-direction:column;gap:5px\">\n<div style=\"display:flex;align-items:center;gap:8px\">\n<div style=\"width:34px;font:400 10px ui-monospace,monospace\">{{ h.day }}<\u002Fdiv>\n<div style=\"width:30px;height:16px;border:1.5px solid #111;position:relative;flex:none\"><div style=\"{{ h.knob }}\"><\u002Fdiv><\u002Fdiv>\n<div style=\"{{ h.cell }}\">{{ h.from }}<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace\">–<\u002Fdiv>\n<div style=\"{{ h.cell }}\">{{ h.to }}<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ h.second }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;align-items:center;gap:8px;padding-left:42px\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">+ then<\u002Fdiv>\n<div style=\"flex:1;border:1.5px solid #111;padding:4px 6px;font:400 10px ui-monospace,monospace;text-align:center\">{{ h.second }}<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;color:#888\">✕<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;font:400 9px/1.6 ui-monospace,monospace;color:#666\">Toggle off = closed that day (Sun). \"+ add a second window\" appears on any open row, for a lunch-break lab like Wed.<\u002Fdiv>\n<div style=\"padding:11px 14px;display:flex;flex-direction:column;gap:5px\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">TIME ZONE<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace\">Asia/Bangkok · fixed, not editable<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:330px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>49<\u002Fb> — <b>⚑<\u002Fb> Three things the PRD's \"weekly hours schedule\" doesn't specify, all decided here: split shifts are supported (a second window per day, common for Thai shophouse labs), 24h is a per-week shortcut, and time zone is fixed to Asia/Bangkok rather than per-lab. If labs outside Thailand are ever in scope, the last one has to change.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">STATUS OVERRIDE · setting it (display is <a href=\"#1d\" style=\"color:#666\">1d<\u002Fa> case C)<\u002Fdiv>\n<div style=\"width:290px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1.5px solid #111;font:400 12px ui-monospace,monospace\">Status override<\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">REASON · fixed list<\u002Fdiv>\n<sc-for list=\"{{ overrideReasons }}\" as=\"o\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;align-items:center;gap:9px\">\n<div style=\"width:14px;height:14px;border:1.5px solid #111;border-radius:50%;flex:none\"><\u002Fdiv>\n<div style=\"font:400 11px ui-monospace,monospace\">{{ o.label }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;display:flex;flex-direction:column;gap:9px\">\n<div><div style=\"font:400 9px ui-monospace,monospace;color:#888;margin-bottom:5px\">PUBLIC NOTE <span style=\"color:#888\">(optional, 60 char)<\u002Fspan><\u002Fdiv><div style=\"border:1.5px solid #111;padding:7px 9px;font:400 10px ui-monospace,monospace\">Renovating until Oct<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:400 9px ui-monospace,monospace;color:#888;margin-bottom:5px\">UNTIL <span style=\"color:#888\">(optional)<\u002Fspan><\u002Fdiv><div style=\"border:1.5px solid #111;padding:7px 9px;font:400 10px ui-monospace,monospace;color:#888\">no end date — clears manually<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:9px\">\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:9px 12px;font:400 11px ui-monospace,monospace;text-align:center\">Set override · live now<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:8px 12px;font:400 11px ui-monospace,monospace;text-align:center\">Clear override<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#666\">Any logged-in user can set or clear this — including clearing someone else's. It outranks the weekly schedule but never the permanent-closed flag.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:290px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>50<\u002Fb> — <b>⚑<\u002Fb> PRD gives two example reasons and no mechanics. Proposed: a fixed 4-reason roster (same argument as the fixed badge roster in the Community PRD — no admin to clean up freeform strings), a short free note for the specifics, and an optional auto-expiry so a stale \"Temporarily closed\" doesn't outlive the renovation.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">ATMOSPHERE PHOTO · add &amp; remove<\u002Fdiv>\n<div style=\"width:290px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1.5px solid #111;font:400 12px ui-monospace,monospace\">Atmosphere photos · 4<\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px\">\n<div style=\"aspect-ratio:1;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf;position:relative\"><div style=\"position:absolute;right:2px;top:2px;font:400 9px ui-monospace,monospace\">✕<\u002Fdiv><\u002Fdiv>\n<div style=\"aspect-ratio:1;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"aspect-ratio:1;border:1.5px dashed #111;display:grid;place-items:center;font:400 18px ui-monospace,monospace\">+<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;border-left:3px solid #111;display:flex;flex-direction:column;gap:5px\">\n<div style=\"font:400 10px ui-monospace,monospace\">Storefront &amp; interior only<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#666\">Not scans, not your negatives. A photo of a developed frame belongs on a Film Stock's gallery — it is never attached to a lab.<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;text-decoration:underline;color:#444\">Upload a Photo instead ↗<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:6px\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">✕ ON YOUR OWN UPLOADS ONLY<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#666\">Photo 1 is yours — removable. Photo 2 is @second-user's; you can't remove it, and there is no report action in MVP.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:290px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>51<\u002Fb> — The in-context guardrail is the only defence for the content-integrity rule, since nothing structurally stops someone uploading a scan here. <b>⚑<\u002Fb> PRD says any contributor can <i>add<\u002Fi> and is silent on <i>remove<\u002Fi> — with no moderator persona, a wrong photo from another user currently has no route off the page at all. Needs a decision.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"2e\" style=\"flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\"><a href=\"#2e\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none\">2e<\u002Fa>Mark as closed · reopen · and a proposal for the same-field collision the PRD lists as open<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:24px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">MARK AS CLOSED · confirm<\u002Fdiv>\n<div style=\"width:280px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:20px 14px;background:#f6f6f6;font:400 10px ui-monospace,monospace;color:#aaa;text-align:center\">lab page, dimmed<\u002Fdiv>\n<div style=\"border-top:1.5px solid #111;padding:16px;display:flex;flex-direction:column;gap:11px\">\n<div style=\"width:34px;height:4px;background:#ddd;border-radius:2px;align-self:center\"><\u002Fdiv>\n<div style=\"font:400 14px/1.4 ui-monospace,monospace\">Mark this lab permanently closed?<\u002Fdiv>\n<div style=\"font:400 10px/1.6 ui-monospace,monospace;color:#666\">It disappears from search but is <b>not<\u002Fb> deleted — pricing, history and inventory stay readable by direct link, and it still appears in a film stock's reverse search, marked closed.<\u002Fdiv>\n<div style=\"border:1px dashed #999;padding:9px 10px;font:400 9px/1.6 ui-monospace,monospace;color:#555\">Temporarily shut for a holiday or renovation? Use a <b>status override<\u002Fb> instead — this flag is for a lab that has stopped operating.<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:7px 9px;font:400 10px ui-monospace,monospace;color:#888\">how do you know? (optional, goes in the log)<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:9px 12px;font:400 11px ui-monospace,monospace;text-align:center\">Mark as closed<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;text-decoration:underline;color:#444;text-align:center\">Cancel<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:280px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>52<\u002Fb> — The only confirmation in the whole product, and it exists to disambiguate rather than to warn: closed-vs-override is the mistake a contributor will actually make. It says \"not deleted\" because trust-by-default plus no moderator means the copy is the only safety net.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">CLOSED LAB · reached by direct link<\u002Fdiv>\n<div style=\"width:280px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:9px 12px;background:#111;color:#fff;font:400 10px/1.5 ui-monospace,monospace\">Permanently closed · hidden from search. You reached this by direct link.<\u002Fdiv>\n<div style=\"padding:14px;border-bottom:1px solid #ddd;display:flex;gap:12px;align-items:flex-start\">\n<div style=\"width:56px;height:56px;flex:none;background:repeating-linear-gradient(45deg,#eee 0 6px,#f6f6f6 6px 12px);border:1px solid #ddd;filter:grayscale(1);opacity:.6\"><\u002Fdiv>\n<div style=\"flex:1\">\n<div style=\"font:400 14px ui-monospace,monospace;color:#666\">Fifth Lab Placeholder<\u002Fdiv>\n<div style=\"font:400 11px 'Noto Sans Thai',sans-serif;color:#999\">ตัวอย่างร้านที่ห้า<\u002Fdiv>\n<div style=\"border:1.5px solid #999;color:#666;padding:2px 6px;font:400 9px ui-monospace,monospace;display:inline-block;margin-top:5px\">CLOSED PERMANENTLY<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;display:flex;flex-direction:column;gap:6px\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">STILL READABLE<\u002Fdiv>\n<div style=\"font:400 10px/1.6 ui-monospace,monospace;color:#666\">Last known pricing, hours, inventory and all 14 history entries — greyed, not hidden.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"border:1.5px solid #111;padding:8px 12px;font:400 11px ui-monospace,monospace;text-align:center\">Reopen this lab<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#666\">\"Reopen\" replaces \"Mark as closed\" and is an ordinary edit — closing is reversible by anyone, marked 12 Aug by @second-user.<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888;border-top:1px dashed #ccc;padding-top:9px\">Directions and Call are disabled; badges become read-only.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:280px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>53<\u002Fb> — <b>⚑<\u002Fb> PRD says a closed lab stays \"viewable\" and doesn't say how much of it stays <i>actionable<\u002Fi>. Proposed: everything readable, contribution still open (so it can be corrected or reopened), but the two actions that would send a person to a shut door — Directions, Call — are dead.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">SAME-FIELD COLLISION · proposal for the PRD's open question<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1.5px solid #111;font:400 12px ui-monospace,monospace\">Editing Placeholder Film Lab<\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;border-left:3px solid #111;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 10px ui-monospace,monospace\">This price changed while you were typing<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<div style=\"display:flex;align-items:center;gap:7px;font:400 10px ui-monospace,monospace\"><span style=\"color:#888;width:52px\">you<\u002Fspan><div style=\"border:1.5px solid #111;padding:2px 7px\">฿200<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:7px;font:400 10px ui-monospace,monospace\"><span style=\"color:#888;width:52px\">@other<\u002Fspan><div style=\"border:1px solid #bbb;padding:2px 7px;color:#555\">฿220<\u002Fdiv><span style=\"color:#888;font-size:9px\">2 min ago<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#666\">Both are visible before anything is written. Nothing has been saved yet.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:8px 12px;font:400 10px ui-monospace,monospace;text-align:center\">Keep mine · ฿200<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:8px 12px;font:400 10px ui-monospace,monospace;text-align:center\">Keep theirs · ฿220<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#666\">Whichever wins, both attempts are logged, so the loser isn't invisible. Last-write-wins with no prompt would make the history log lie about what people saw.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>54<\u002Fb> — <b>⚑<\u002Fb> This is the PRD's named open question (\"same-field edit collision\"), drawn as one option rather than resolved: detect on save, show both, let the contributor choose, log both. The alternative — silent last-write-wins — needs no screen at all, which is exactly why it should be an explicit decision.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font:400 13px ui-monospace,Menlo,monospace;color:#1a1a1a;padding:6px 0 14px;border-top:1px solid rgba(0,0,0,.15)\">A6 · SYSTEM STATES — LOADING · ERROR · OVERFLOW<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:0\">\n\n<div id=\"2f\" style=\"flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\"><a href=\"#2f\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none\">2f<\u002Fa>Failure &amp; extreme-content states the PRD is silent on<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:24px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">SEARCH FAILED · filters survive<\u002Fdiv>\n<div style=\"width:262px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;display:flex;gap:6px\">\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:3px 7px;font:400 9px ui-monospace,monospace\">Process · 2<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:3px 7px;font:400 9px ui-monospace,monospace\">≤ 5 km<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center\">\n<div style=\"width:44px;height:44px;border:1.5px dashed #111\"><\u002Fdiv>\n<div style=\"font:400 13px/1.4 ui-monospace,monospace\">Couldn't load labs<\u002Fdiv>\n<div style=\"font:400 10px/1.6 ui-monospace,monospace;color:#666\">Your filters are still set. This is us, not you.<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:8px 12px;font:400 11px ui-monospace,monospace\">Try again<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid #ddd;padding:11px 14px;font:400 9px/1.6 ui-monospace,monospace;color:#666\">Distinct from the two empty states in <a href=\"#1b\" style=\"color:#666\">1b<\u002Fa>: those are true answers, this is no answer. Never show \"add the first lab\" on a failed request.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:262px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:8px 12px;background:#f4f4f4;border-bottom:1.5px solid #111;font:400 10px ui-monospace,monospace\">⚠ Offline — showing labs from 10 min ago<\u002Fdiv>\n<div style=\"position:relative;height:120px;background:repeating-linear-gradient(0deg,#f0f0f0 0 22px,#fafafa 22px 23px),repeating-linear-gradient(90deg,#f0f0f0 0 22px,#fafafa 22px 23px);opacity:.5\">\n<div style=\"position:absolute;left:110px;top:44px;font:400 9px ui-monospace,monospace;color:#888\">tiles unavailable<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:11px 14px;font:400 9px/1.6 ui-monospace,monospace;color:#666\">Cached list stays readable; the map degrades to a flat grid instead of a spinner. Contribute actions are hidden while offline — a queued edit would break \"live immediately\".<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:262px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>55<\u002Fb> — <b>⚑<\u002Fb> PRD has no error or connectivity requirements. The load-bearing decision: offline hides contribution entirely, because a trust-by-default model with no queue has nowhere to park a pending edit.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">PUBLISH FAILED · draft kept<\u002Fdiv>\n<div style=\"width:262px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1px solid #ddd;display:flex;align-items:baseline;gap:8px\"><div style=\"font:400 12px ui-monospace,monospace;flex:1\">Add a lab<\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace;color:#888\">4 / 4<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;border-left:3px solid #111;display:flex;flex-direction:column;gap:6px\">\n<div style=\"font:400 10px ui-monospace,monospace\">Couldn't publish<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#666\">Your entry is saved on this device. Nothing was published, and nothing was lost.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:8px 12px;font:400 10px ui-monospace,monospace;text-align:center\">Try publishing again<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:8px 12px;font:400 10px ui-monospace,monospace;text-align:center\">Save draft &amp; close<\u002Fdiv>\n<div style=\"font:400 9px/1.6 ui-monospace,monospace;color:#666\">Same local-draft mechanic as the sign-in gate in <a href=\"#1h\" style=\"color:#666\">1h<\u002Fa> — one behaviour, two triggers.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:262px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:20px 14px;background:#f6f6f6;font:400 10px ui-monospace,monospace;color:#aaa;text-align:center\">form, dimmed<\u002Fdiv>\n<div style=\"border-top:1.5px solid #111;padding:16px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font:400 13px/1.4 ui-monospace,monospace\">Leave without publishing?<\u002Fdiv>\n<div style=\"font:400 10px/1.6 ui-monospace,monospace;color:#666\">3 of 4 steps are filled. We'll keep it on this device for 7 days.<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:8px 12px;font:400 10px ui-monospace,monospace;text-align:center\">Keep the draft<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;text-decoration:underline;color:#444;text-align:center\">Discard it<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:262px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>56<\u002Fb> — Back-out, refresh and publish failure all resolve to the same local draft, which is why <a href=\"#1h\" style=\"color:#2a78d6\">1h<\u002Fa>'s 4-step flow can be interrupted anywhere. <b>⚑<\u002Fb> Draft lifetime (7 days, device-local, not synced) is invented here.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">EXTREME CONTENT · one card, three stress cases<\u002Fdiv>\n<div style=\"width:300px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;font:400 9px ui-monospace,monospace;color:#888\">LONG NAME · 2-line clamp both locales<\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;display:flex;gap:10px\">\n<div style=\"width:56px;height:56px;flex:none;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"flex:1;min-width:0\">\n<div style=\"font:400 12px/1.35 ui-monospace,monospace;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden\">Placeholder Film Lab &amp; Darkroom Supply Company (Sukhumvit Branch)<\u002Fdiv>\n<div style=\"font:400 11px/1.45 'Noto Sans Thai',sans-serif;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">แล็บฟิล์มและอุปกรณ์ห้องมืด ตัวอย่าง สาขาสุขุมวิท<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888;margin-top:4px\">2 lines max, then ellipsis · full name only on the detail page<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;font:400 9px ui-monospace,monospace;color:#888\">12 STOCKS IN INVENTORY · chip overflow<\u002Fdiv>\n<div style=\"padding:12px 14px;border-bottom:1px solid #ddd;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start\">\n<sc-for list=\"{{ fewChips }}\" as=\"c\" hint-placeholder-count=\"5\"><div style=\"border:1px solid #111;padding:2px 6px;font:400 9px ui-monospace,monospace\">{{ c }}<\u002Fdiv><\u002Fsc-for>\n<div style=\"border:1px solid #111;background:#111;color:#fff;padding:2px 6px;font:400 9px ui-monospace,monospace\">show all 12<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:8px 14px;border-bottom:1px solid #ddd;font:400 9px ui-monospace,monospace;color:#666\">clamps to 2 rows, last slot always the \"show all\" chip · never a horizontal scroller inside a vertical list<\u002Fdiv>\n<div style=\"padding:10px 14px;font:400 9px ui-monospace,monospace;color:#888\">SPLIT-SHIFT DAY · single line, two windows<\u002Fdiv>\n<div style=\"padding:8px 14px 14px;display:flex;align-items:baseline;gap:10px\">\n<div style=\"width:34px;font:400 10px ui-monospace,monospace\">Wed<\u002Fdiv>\n<div style=\"font:400 10px/1.5 ui-monospace,monospace\">09:00 – 13:00, 15:00 – 19:00<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>57<\u002Fb> — Card height must stay uniform for the list in <a href=\"#1b\" style=\"color:#2a78d6\">1b<\u002Fa> to scan, so every unbounded field gets a clamp rule: 2 lines for the Latin name, 1 + ellipsis for the Thai, 2 rows for chips. <b>⚑<\u002Fb> Result-set size is still unspecified — 7 labs is drawn everywhere, and nothing in the PRD says what 200 labs in one district does to the list or the map pins.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"t1\" style=\"padding:40px 44px 48px;font-family:'Architects Daughter','Noto Sans Thai',cursive\">\n<div style=\"display:flex;align-items:baseline;gap:10px;margin:0 0 8px\">\n<a href=\"#t1\" style=\"font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none\">1<\u002Fa>\n<span style=\"font:400 15px/1.2 'Architects Daughter',cursive;color:#1a1a1a\">Grains — structural wireframe pass · mobile 390 + desktop 1280 · TH/EN<\u002Fspan>\n<\u002Fdiv>\n<p style=\"max-width:900px;margin:0 0 26px;font:400 13px/1.6 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\">Grayscale, structure only — no palette, type or imagery decisions. Blue dashed notes and numbered pins are annotations, not UI. Bilingual model: chrome and labels swap language; data that stays Latin in both locales (C-41, ECN-2, B&amp;W, E-6, Noritsu, SP-3000, film names) is set inline in a fixed slot, so a label stack carries a Thai line + a Latin line rather than one swapping string.<\u002Fp>\n\n<div style=\"font:400 13px ui-monospace,Menlo,monospace;color:#1a1a1a;padding:6px 0 14px;border-top:1px solid rgba(0,0,0,.15)\">FOUNDATION<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:0 0 40px\">\n\n<div id=\"1a\" style=\"flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\"><a href=\"#1a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none\">1a<\u002Fa>App shell + bilingual label anatomy<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:34px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">MOBILE SHELL · 390<\u002Fdiv>\n<div style=\"width:390px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec;border-bottom:1px solid #ddd\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1.5px solid #111\">\n<div style=\"width:66px;height:20px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">GRAINS<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"width:26px;height:26px;border:1.5px solid #111;border-radius:50%;display:grid;place-items:center;font:400 12px ui-monospace,monospace\">⌕<\u002Fdiv>\n<div style=\"display:flex;border:1.5px solid #111\">\n<div style=\"padding:3px 8px;background:#111;color:#fff;font:400 11px ui-monospace,monospace\">TH<\u002Fdiv>\n<div style=\"padding:3px 8px;font:400 11px ui-monospace,monospace\">EN<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:18px 14px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"height:110px;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf;display:grid;place-items:center;font:400 11px ui-monospace,monospace;color:#777\">screen content<\u002Fdiv>\n<div style=\"border:1px dashed #2a78d6;padding:8px 10px;font:400 11px/1.45 ui-monospace,Menlo,monospace;color:#2a78d6\">Global search lives in the header (icon → full-screen search sheet), not in the tab bar.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;border-top:1.5px solid #111;display:flex;padding:8px 0 10px\">\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\"><div style=\"width:20px;height:20px;border:1.5px solid #111\"><\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace\">Labs<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\"><div style=\"width:20px;height:20px;border:1.5px solid #111\"><\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace\">Films<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\"><div style=\"width:34px;height:34px;border:1.5px solid #111;border-radius:50%;display:grid;place-items:center;font:400 16px ui-monospace,monospace;margin-top:-14px;background:#fff\">+<\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace\">Add<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\"><div style=\"width:20px;height:20px;border:1.5px solid #111\"><\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace\">Community<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\"><div style=\"width:20px;height:20px;border:1.5px solid #111;border-radius:50%\"><\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace\">Profile<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:390px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>1<\u002Fb> — 7 destinations don't fit 5 tabs. Mobile keeps Labs / Films / Community / Profile, promotes Contribute to a centre FAB, moves Search to the header, and nests <i>My Photobooks<\u002Fi> inside Profile. Desktop shows all 7 flat.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">DESKTOP SHELL · 1280<\u002Fdiv>\n<div style=\"width:760px;border:1.5px solid #111;background:#fff\">\n<div style=\"display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1.5px solid #111\">\n<div style=\"width:70px;height:22px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">GRAINS<\u002Fdiv>\n<div style=\"display:flex;gap:14px;font:400 11px ui-monospace,monospace\">\n<div style=\"padding-bottom:2px;border-bottom:2px solid #111\">Labs<\u002Fdiv><div>Films<\u002Fdiv><div>Community<\u002Fdiv><div>My Photobooks<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;height:26px;border:1.5px solid #111;display:flex;align-items:center;padding:0 8px;font:400 10px ui-monospace,monospace;color:#888\">⌕ search labs, films, people<\u002Fdiv>\n<div style=\"height:26px;border:1.5px solid #111;padding:0 10px;display:grid;place-items:center;font:400 10px ui-monospace,monospace\">+ Contribute<\u002Fdiv>\n<div style=\"display:flex;border:1.5px solid #111\"><div style=\"padding:4px 8px;background:#111;color:#fff;font:400 10px ui-monospace,monospace\">TH<\u002Fdiv><div style=\"padding:4px 8px;font:400 10px ui-monospace,monospace\">EN<\u002Fdiv><\u002Fdiv>\n<div style=\"width:26px;height:26px;border:1.5px solid #111;border-radius:50%\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:150px;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border-bottom:1px solid #cfcfcf;display:grid;place-items:center;font:400 11px ui-monospace,monospace;color:#777\">screen content<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width:760px;display:flex;flex-direction:column;gap:12px;margin-top:6px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">BILINGUAL LABEL ANATOMY — three label classes, three rules<\u002Fdiv>\n<div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n<div style=\"width:240px;border:1.5px solid #111;padding:12px\">\n<div style=\"font:400 10px ui-monospace,monospace;color:#888;margin-bottom:8px\">1 · NAME STACK (two-line slot)<\u002Fdiv>\n<div style=\"font:400 16px 'Noto Sans Thai',sans-serif;line-height:1.35\">แล็บฟิล์ม ตัวอย่าง<\u002Fdiv>\n<div style=\"font:400 11px ui-monospace,monospace;color:#666;margin-top:2px\">Placeholder Film Lab<\u002Fdiv>\n<div style=\"height:1px;background:#ddd;margin:10px 0\"><\u002Fdiv>\n<div style=\"font:400 10px/1.5 ui-monospace,monospace;color:#666\">Both lines always render, order flips with locale. Reserve 2 lines at mobile, 1–2 at desktop.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:240px;border:1.5px solid #111;padding:12px\">\n<div style=\"font:400 10px ui-monospace,monospace;color:#888;margin-bottom:8px\">2 · LATIN-LOCKED DATA<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:5px\">\n<div style=\"border:1.5px solid #111;padding:3px 7px;font:400 11px ui-monospace,monospace\">C-41<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:3px 7px;font:400 11px ui-monospace,monospace\">ECN-2<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:3px 7px;font:400 11px ui-monospace,monospace\">B&amp;W<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:3px 7px;font:400 11px ui-monospace,monospace\">E-6<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 11px ui-monospace,monospace;color:#666;margin-top:8px\">Noritsu HS-1800 · SP-3000 · Portra 400<\u002Fdiv>\n<div style=\"height:1px;background:#ddd;margin:10px 0\"><\u002Fdiv>\n<div style=\"font:400 10px/1.5 ui-monospace,monospace;color:#666\">Never translated. Optional Thai gloss sits <i>beside<\u002Fi> the chip, not inside it: <span style=\"font-family:'Noto Sans Thai',sans-serif\">ฟิล์มสี<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:240px;border:1.5px solid #111;padding:12px\">\n<div style=\"font:400 10px ui-monospace,monospace;color:#888;margin-bottom:8px\">3 · UI CHROME (swaps)<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<div style=\"border:1.5px solid #111;padding:5px 8px;font:400 12px 'Noto Sans Thai',sans-serif;display:flex;justify-content:space-between\"><span>กระบวนการล้าง<\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:10px;color:#888\">▾<\u002Fspan><\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:5px 8px;font:400 11px ui-monospace,monospace;display:flex;justify-content:space-between\"><span>Chemical process<\u002Fspan><span style=\"font-size:10px;color:#888\">▾<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:1px;background:#ddd;margin:10px 0\"><\u002Fdiv>\n<div style=\"font:400 10px/1.5 ui-monospace,monospace;color:#666\">Thai runs ~15–30% shorter but taller (tone marks + descenders). Size chrome slots by <i>height<\u002Fi>, never by English character count.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>2<\u002Fb> — Toggle is a persistent header control on both layouts (chosen over a settings-menu item), because switching locale is a browsing behaviour here, not a one-time preference: names and reviews are crowdsourced and often only filled in one language.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font:400 13px ui-monospace,Menlo,monospace;color:#1a1a1a;padding:6px 0 14px;border-top:1px solid rgba(0,0,0,.15)\">A · LAB DIRECTORY &amp; DISCOVERY<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:0 0 40px\">\n\n<div id=\"1b\" style=\"flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\"><a href=\"#1b\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none\">1b<\u002Fa>Search / discovery — mobile (list · map · empty states) + Thai frame<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:24px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">LIST VIEW · filters applied<\u002Fdiv>\n<div style=\"width:390px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #ddd\">\n<div style=\"width:66px;height:20px;border:1.5px solid #111;display:grid;place-items:center;font:400 10px ui-monospace,monospace\">GRAINS<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv>\n<div style=\"width:24px;height:24px;border:1.5px solid #111;border-radius:50%;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">⌕<\u002Fdiv>\n<div style=\"display:flex;border:1.5px solid #111\"><div style=\"padding:2px 6px;font:400 10px ui-monospace,monospace\">TH<\u002Fdiv><div style=\"padding:2px 6px;background:#111;color:#fff;font:400 10px ui-monospace,monospace\">EN<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px\">\n<div style=\"width:16px;height:16px;border:1.5px solid #111;border-radius:50%\"><\u002Fdiv>\n<div style=\"font:400 12px ui-monospace,monospace\">Near me · Placeholder District<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;text-decoration:underline\">Change<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:10px 14px;border-bottom:1px solid #ddd;display:flex;gap:6px;overflow:hidden\">\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:4px 8px;font:400 10px ui-monospace,monospace;white-space:nowrap\">Process · 2 ✕<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:4px 8px;font:400 10px ui-monospace,monospace;white-space:nowrap\">Scanner ▾<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:4px 8px;font:400 10px ui-monospace,monospace;white-space:nowrap\">≤ 5 km ✕<\u002Fdiv>\n<div style=\"border:1.5px solid #111;padding:4px 8px;font:400 10px ui-monospace,monospace;white-space:nowrap\">⚙<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd\">\n<div style=\"font:400 10px ui-monospace,monospace;color:#666\">7 labs · nearest + most complete first<\u002Fdiv>\n<div style=\"display:flex;border:1.5px solid #111\"><div style=\"padding:3px 9px;background:#111;color:#fff;font:400 10px ui-monospace,monospace\">List<\u002Fdiv><div style=\"paddi ion:none\">1k<\u002Fa>Photobook detail — true-aspect grid, one artist's note · mobile + desktop<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:24px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">MOBILE<\u002Fdiv>\n<div style=\"width:390px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #ddd\">\n<div style=\"width:24px;height:24px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">‹<\u002Fdiv>\n<div style=\"flex:1;font:400 11px ui-monospace,monospace;color:#666\">@placeholder<\u002Fdiv>\n<div style=\"width:24px;height:24px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">⤴<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:22px 16px 18px;border-bottom:1px solid #ddd\">\n<div style=\"font:400 24px/1.2 ui-monospace,monospace\">Bangkok Overcast<\u002Fdiv>\n<div style=\"font:400 12px/1.7 ui-monospace,monospace;color:#444;margin-top:12px;max-width:300px\">Grey light on the way to work, mostly Portra 400 pushed one stop. Two years of the same three streets, waiting for the sky to flatten.<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;color:#888;margin-top:12px\">14 Photos · 5 Connected · by @placeholder<\u002Fdiv>\n<div style=\"border:1px dashed #999;padding:7px 9px;font:400 9px/1.5 ui-monospace,monospace;color:#555;margin-top:12px\">One note for the whole book — there is no per-Photo caption anywhere in a Photobook.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:16px;display:flex;flex-direction:column;gap:16px\">\n<sc-for list=\"{{ bookPhotos }}\" as=\"p\" hint-placeholder-count=\"5\">\n<div>\n<div style=\"aspect-ratio:{{ p.ratio }};background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf;display:grid;place-items:center;font:400 9px ui-monospace,monospace;color:#999\">{{ p.label }}<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888;margin-top:5px\">{{ p.credit }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"border:1px dashed #2a78d6;padding:9px 11px;font:400 10px/1.55 ui-monospace,monospace;color:#2a78d6\"><b>26<\u002Fb> — Mobile is a single column at full width so every frame keeps its true ratio at maximum size; desktop is a 2-col masonry. No cropping, no uniform tiles, so the column is deliberately ragged in height.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">DESKTOP + STATES<\u002Fdiv>\n<div style=\"width:820px;border:1.5px solid #111;background:#fff\">\n<div style=\"display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1.5px solid #111\">\n<div style=\"width:70px;height:22px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">GRAINS<\u002Fdiv>\n<div style=\"flex:1;font:400 10px ui-monospace,monospace;color:#888\">/u/@placeholder / Bangkok Overcast<\u002Fdiv>\n<div style=\"height:26px;border:1.5px solid #111;padding:0 10px;display:grid;place-items:center;font:400 10px ui-monospace,monospace\">⤴ Share<\u002Fdiv>\n<div style=\"display:flex;border:1.5px solid #111\"><div style=\"padding:4px 7px;font:400 10px ui-monospace,monospace\">TH<\u002Fdiv><div style=\"padding:4px 7px;background:#111;color:#fff;font:400 10px ui-monospace,monospace\">EN<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex\">\n<div style=\"width:280px;border-right:1px solid #ddd;padding:28px 22px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 26px/1.2 ui-monospace,monospace\">Bangkok Overcast<\u002Fdiv>\n<div style=\"font:400 12px/1.75 ui-monospace,monospace;color:#444\">Grey light on the way to work, mostly Portra 400 pushed one stop. Two years of the same three streets, waiting for the sky to flatten.<\u002Fdiv>\n<div style=\"font:400 10px/1.7 ui-monospace,monospace;color:#888\">14 Photos · 5 Connected<br>by <span style=\"text-decoration:underline\">@placeholder<\u002Fspan><\u002Fdiv>\n<div style=\"border:1px dashed #2a78d6;padding:8px 10px;font:400 10px/1.5 ui-monospace,monospace;color:#2a78d6\"><b>27<\u002Fb> — Desktop pins title + note in a sticky column so the note stays legible through a long scroll; mobile prints it once at the top and lets it scroll away.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;padding:22px\">\n<div style=\"column-count:2;column-gap:14px\">\n<sc-for list=\"{{ bookPhotosWide }}\" as=\"p\" hint-placeholder-count=\"6\">\n<div style=\"break-inside:avoid;margin-bottom:14px\">\n<div style=\"aspect-ratio:{{ p.ratio }};background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf;display:grid;place-items:center;font:400 9px ui-monospace,monospace;color:#999\">{{ p.label }}<\u002Fdiv>\n<div style=\"font:400 9px ui-monospace,monospace;color:#888;margin-top:5px\">{{ p.credit }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n<div style=\"width:390px;border:1.5px solid #111;border-radius:12px;overflow:hidden;background:#fff\">\n<div style=\"padding:8px 12px;border-bottom:1px solid #ddd;font:400 9px ui-monospace,monospace;color:#888\">CONNECTED PHOTO · attribution in place<\u002Fdiv>\n<div style=\"padding:14px;display:flex;gap:12px;align-items:flex-start\">\n<div style=\"width:120px;height:80px;flex:none;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"flex:1;font:400 10px/1.6 ui-monospace,monospace;color:#555\">Own Photos show no credit line at all. Connected Photos always show <b>via @original-uploader<\u002Fb> under the frame — derived from the reference, never stored or editable by the curator.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:390px;border:1.5px solid #111;border-radius:12px;overflow:hidden;background:#fff\">\n<div style=\"padding:8px 12px;border-bottom:1px solid #ddd;font:400 9px ui-monospace,monospace;color:#888\">SOURCE DELETED · silent reflow, no tombstone<\u002Fdiv>\n<div style=\"padding:14px;display:flex;gap:10px;align-items:center\">\n<div style=\"width:70px;height:50px;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"width:70px;height:50px;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"width:70px;height:50px;border:1px dashed #ccc;display:grid;place-items:center;font:400 8px ui-monospace,monospace;color:#bbb;text-align:center\">slot<br>removed<\u002Fdiv>\n<div style=\"flex:1;font:400 9px/1.55 ui-monospace,monospace;color:#555\">Grid re-flows as if the Connection never existed — no placeholder, no \"removed\" notice, no gap. Nothing in this screen tells the curator a slot disappeared.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:390px;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>28<\u002Fb> — Silent reflow is deliberate (books always read as intentional) but it is the one resolved decision with no UI to show it. Flagged here so it stays visible when Photobooks start being used as sequenced essays.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"1l\" style=\"flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.55)\"><a href=\"#1l\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none\">1l<\u002Fa>Photo detail — metadata without Lab, plus the Connect action<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:24px;display:flex;gap:24px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">MOBILE · viewer is not the uploader<\u002Fdiv>\n<div style=\"width:390px;border:1.5px solid #111;border-radius:14px;overflow:hidden;background:#fff\">\n<div style=\"height:22px;background:#ececec\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #ddd\">\n<div style=\"width:24px;height:24px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">✕<\u002Fdiv>\n<div style=\"flex:1;font:400 10px ui-monospace,monospace;color:#666\">Bangkok Overcast · 4 / 14<\u002Fdiv>\n<div style=\"width:24px;height:24px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">⤴<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:16px 14px 12px\">\n<div style=\"aspect-ratio:6/7;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf;display:grid;place-items:center;font:400 10px ui-monospace,monospace;color:#999\">6:7 · full frame, no crop<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:10px\">\n<div style=\"font:400 10px ui-monospace,monospace;color:#666\">‹ swipe within the book ›<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;color:#666\">by <span style=\"text-decoration:underline\">@placeholder<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:0 14px 14px\">\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:12px 0;text-align:center;font:400 12px ui-monospace,monospace\">＋ Connect to a Photobook<\u002Fdiv>\n<div style=\"font:400 9px/1.55 ui-monospace,monospace;color:#888;margin-top:7px;text-align:center\">Saves a reference into your own book — no re-upload, doesn't count against your upload cap.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:14px;border-top:1px solid #ddd\">\n<div style=\"font:400 10px ui-monospace,monospace;color:#888;margin-bottom:11px\">METADATA<\u002Fdiv>\n<sc-for list=\"{{ photoMeta }}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid #eee\">\n<div style=\"width:88px;flex:none;font:400 9px ui-monospace,monospace;color:#888\">{{ m.k }}<\u002Fdiv>\n<div style=\"flex:1;font:400 12px ui-monospace,monospace\">{{ m.v }}<\u002Fdiv>\n<div style=\"font:400 10px ui-monospace,monospace;color:#666\">{{ m.link }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"border:1px dashed #2a78d6;padding:8px 10px;font:400 10px/1.55 ui-monospace,monospace;color:#2a78d6;margin-top:12px\"><b>29<\u002Fb> — There is no Lab row here, and no \"where was this developed\" affordance to tap — by rule, not by omission. Scanner model is shown as neutral technical metadata in the same class as Camera. Film Stock and Scanner are the only rows that link out.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:14px;border-top:1px solid #ddd\">\n<div style=\"font:400 10px ui-monospace,monospace;color:#888;margin-bottom:9px\">ALSO APPEARS IN · 7 Photobooks<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<div style=\"flex:1;height:56px;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"flex:1;height:56px;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"flex:1;height:56px;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"flex:1;height:56px;border:1px dashed #ccc;display:grid;place-items:center;font:400 9px ui-monospace,monospace;color:#999\">+4<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 9px/1.55 ui-monospace,monospace;color:#888;margin-top:8px\">One canonical Photo, many contexts — this row is the visible proof of the reference model.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">CONNECT SHEET · 3 states<\u002Fdiv>\n<div style=\"width:330px;border:1.5px solid #111;border-radius:12px;overflow:hidden;background:#fff\">\n<div style=\"padding:8px 12px;border-bottom:1px solid #ddd;font:400 9px ui-monospace,monospace;color:#888\">PICK A DESTINATION BOOK<\u002Fdiv>\n<div style=\"padding:14px\">\n<div style=\"width:44px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 12px\"><\u002Fdiv>\n<div style=\"font:400 14px ui-monospace,monospace;margin-bottom:12px\">Connect to…<\u002Fdiv>\n<sc-for list=\"{{ connectTargets }}\" as=\"t\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;align-items:center;gap:10px;border:1.5px solid #111;padding:9px;margin-bottom:7px\">\n<div style=\"width:34px;height:34px;flex:none;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"flex:1;min-width:0\"><div style=\"font:400 11px ui-monospace,monospace\">{{ t.title }}<\u002Fdiv><div style=\"font:400 9px ui-monospace,monospace;color:#888\">{{ t.count }}<\u002Fdiv><\u002Fdiv>\n<div style=\"width:15px;height:15px;border:1.5px solid #111;display:grid;place-items:center;font:400 9px ui-monospace,monospace;background:{{ t.fill }};color:{{ t.tick }}\">{{ t.mark }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"border:1px dashed #111;padding:9px;font:400 11px ui-monospace,monospace;text-align:center;margin-bottom:10px\">+ New Photobook<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:11px 0;text-align:center;font:400 12px ui-monospace,monospace\">Connect to 2 books<\u002Fdiv>\n<div style=\"font:400 9px/1.5 ui-monospace,monospace;color:#888;margin-top:8px\">Multi-select: one Photo can land in several of your books at once — that's the whole point of the atomic model.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:330px;border:1.5px solid #111;border-radius:12px;overflow:hidden;background:#fff\">\n<div style=\"padding:8px 12px;border-bottom:1px solid #ddd;font:400 9px ui-monospace,monospace;color:#888\">ALREADY CONNECTED · and logged out<\u002Fdiv>\n<div style=\"padding:14px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"border:1.5px solid #111;padding:11px 0;text-align:center;font:400 12px ui-monospace,monospace\">✓ Connected · in 2 of your books<\u002Fdiv>\n<div style=\"font:400 9px/1.55 ui-monospace,monospace;color:#666\">Tapping again reopens the sheet with those books ticked, so disconnecting is the same control — no separate remove flow.<\u002Fdiv>\n<div style=\"height:1px;background:#ddd\"><\u002Fdiv>\n<div style=\"border:1.5px dashed #999;padding:11px 0;text-align:center;font:400 12px ui-monospace,monospace;color:#777\">＋ Connect to a Photobook<\u002Fdiv>\n<div style=\"font:400 9px/1.55 ui-monospace,monospace;color:#666\">Logged out: the button stays visible (it explains the mechanic) and opens the sign-in sheet from <a href=\"#1h\">1h<\u002Fa>. Metadata and the image itself never require an account.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:330px;border:1.5px solid #111;border-radius:12px;overflow:hidden;background:#fff\">\n<div style=\"padding:8px 12px;border-bottom:1px solid #ddd;font:400 9px ui-monospace,monospace;color:#888\">OWN PHOTO · uploader's view<\u002Fdiv>\n<div style=\"padding:14px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;gap:8px\">\n<div style=\"flex:1;border:1.5px solid #111;padding:9px 0;text-align:center;font:400 11px ui-monospace,monospace\">Edit metadata<\u002Fdiv>\n<div style=\"flex:1;border:1.5px solid #111;padding:9px 0;text-align:center;font:400 11px ui-monospace,monospace\">Delete<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px dashed #999;padding:8px 10px;font:400 9px/1.55 ui-monospace,monospace;color:#444\">Deleting removes it from all 7 Photobooks that Connected it. Editing a metadata tag updates it everywhere, including the Film Stock gallery.<\u002Fdiv>\n<div style=\"border:1px dashed #2a78d6;padding:8px 10px;font:400 10px/1.5 ui-monospace,monospace;color:#2a78d6\"><b>30<\u002Fb> — Deletion is the only recourse against unwanted Connections (no consent gate in MVP), so this confirmation has to state the cascade in plain numbers.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:400 11px ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">DESKTOP · image left, metadata rail right<\u002Fdiv>\n<div style=\"width:820px;border:1.5px solid #111;background:#fff\">\n<div style=\"display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1.5px solid #111\">\n<div style=\"width:24px;height:24px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">✕<\u002Fdiv>\n<div style=\"flex:1;font:400 10px ui-monospace,monospace;color:#888\">/u/@placeholder / Bangkok Overcast / Photo 4 of 14<\u002Fdiv>\n<div style=\"display:flex;gap:8px\"><div style=\"width:26px;height:26px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">‹<\u002Fdiv><div style=\"width:26px;height:26px;border:1.5px solid #111;display:grid;place-items:center;font:400 11px ui-monospace,monospace\">›<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex\">\n<div style=\"flex:1;padding:26px;background:#fafafa;display:grid;place-items:center\">\n<div style=\"width:420px;aspect-ratio:6/7;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf;display:grid;place-items:center;font:400 10px ui-monospace,monospace;color:#999\">6:7 · fits to viewport height, never cropped<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:320px;border-left:1px solid #ddd;padding:26px 22px;display:flex;flex-direction:column;gap:18px\">\n<div>\n<div style=\"font:400 10px ui-monospace,monospace;color:#888;margin-bottom:5px\">UPLOADED BY<\u002Fdiv>\n<div style=\"font:400 14px ui-monospace,monospace;text-decoration:underline\">@placeholder<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1.5px solid #111;background:#111;color:#fff;padding:11px 0;text-align:center;font:400 12px ui-monospace,monospace\">＋ Connect to a Photobook<\u002Fdiv>\n<div>\n<div style=\"font:400 10px ui-monospace,monospace;color:#888;margin-bottom:10px\">METADATA<\u002Fdiv>\n<sc-for list=\"{{ photoMeta }}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"padding:8px 0;border-bottom:1px solid #eee\">\n<div style=\"font:400 9px ui-monospace,monospace;color:#888\">{{ m.k }}<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:8px;margin-top:3px\"><div style=\"flex:1;font:400 12px ui-monospace,monospace\">{{ m.v }}<\u002Fdiv><div style=\"font:400 10px ui-monospace,monospace;color:#666\">{{ m.link }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"font:400 9px/1.55 ui-monospace,monospace;color:#888;margin-top:9px\">Rail order is fixed across every Photo so absent fields read as \"not tagged\", never as a different layout.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font:400 10px ui-monospace,monospace;color:#888;margin-bottom:9px\">ALSO APPEARS IN · 7<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:6px\">\n<div style=\"aspect-ratio:1;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"aspect-ratio:1;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"aspect-ratio:1;background:repeating-linear-gradient(45deg,#e8e8e8 0 6px,#f4f4f4 6px 12px);border:1px solid #cfcfcf\"><\u002Fdiv>\n<div style=\"aspect-ratio:1;border:1px dashed #ccc;display:grid;place-items:center;font:400 9px ui-monospace,monospace;color:#999\">+4<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:820px;display:flex;gap:12px\">\n<div style=\"flex:1;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>31<\u002Fb> — Structural difference: mobile is a scrolling page (image → Connect → metadata → appears-in) with swipe navigation; desktop is a two-pane lightbox with arrow keys and a metadata rail that never scrolls out of view.<\u002Fdiv>\n<div style=\"flex:1;border:1px dashed #2a78d6;padding:9px 11px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#2a78d6\"><b>32<\u002Fb> — Every metadata value is a directory link except Chemistry, so a Photo is an entry point into the catalog: Film Stock → its gallery + reverse search, Camera / Scanner → filtered browse. None of them lead to a lab.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font:400 12px/1.6 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)\">Try next: \"expand <a href=\"#1b\">1b<\u002Fa> into the location-permission-denied and manual-city-search states\" · \"wireframe the edit-history / revert screen referenced in <a href=\"#1h\">1h<\u002Fa>\" · \"show <a href=\"#1f\">1f<\u002Fa> and <a href=\"#1j\">1j<\u002Fa> at tablet width\" · \"new directions for <a href=\"#1k\">1k<\u002Fa>\"<\u002Fp>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1000}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const labs = [\n      {en:'Placeho
