name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI deliberately does not build and does not touch a database. Vercel builds
# every push with the real environment, and the schema tests need credentials
# CI has no business holding. What is left is the three checks that catch
# mistakes without secrets.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check
